<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基金数据 · GC的数据监控中心</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    .page-title .title-note{font-weight:500;font-size:.72em;color:var(--mu);margin-left:.15em}
    .page-title .sample-badge{
      display:inline-block;margin-left:.45em;padding:1px 7px;border:1px solid var(--bb);
      color:var(--bb);font:650 10px/1.4 var(--mono);letter-spacing:.06em;vertical-align:middle
    }
    .page-title .sample-badge[hidden]{display:none}
    .kpi-bar{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;
      border:var(--hair);margin:0 0 12px;background:var(--bd);
    }
    .kpi-bar .c{background:var(--bg-2);padding:8px 10px;min-width:0;border-right:var(--hair)}
    .kpi-bar .c:last-child{border-right:0}
    .kpi-bar .k{font-size:10px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
    .kpi-bar .v{font:700 16px/1.25 var(--mono);color:var(--bb);margin-top:3px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kpi-bar .d{font:10px/1.3 var(--mono);color:var(--mu-2);margin-top:2px}
    .kpi-bar .v.pos{color:var(--pos)}.kpi-bar .v.neg{color:var(--neg)}.kpi-bar .v.neu{color:var(--bb)}
    .seg{
      display:flex;flex-wrap:wrap;gap:0;border:var(--hair);margin:0 0 10px;background:var(--bd);width:fit-content;max-width:100%
    }
    .seg button{
      appearance:none;border:0;border-right:var(--hair);background:#050505;color:var(--mu);
      font:650 11px/1 var(--mono);letter-spacing:.04em;padding:8px 14px;cursor:pointer
    }
    .seg button:last-child{border-right:0}
    .seg button.active{background:rgba(255,160,40,.12);color:var(--bb)}
    .seg button:hover{color:var(--tx)}
    .tbl-cap{
      display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;
      margin:0 0 6px;font:11px/1.4 var(--mono);color:var(--mu-2)
    }
    .tbl-cap .t{color:var(--bb);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:var(--hair);margin-bottom:12px}
    table.data{width:100%;border-collapse:collapse;font:12px/1.35 var(--mono);font-variant-numeric:tabular-nums;min-width:980px}
    table.data.compact{min-width:720px}
    table.data th,table.data td{padding:5px 8px;border-bottom:1px solid #1a1a1a;text-align:right;white-space:nowrap}
    table.data th:first-child,table.data td:first-child,
    table.data th.l,table.data td.l{text-align:left}
    table.data th{
      font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu-2);
      background:#050505;font-weight:650;position:sticky;top:0
    }
    table.data tbody tr:nth-child(even) td{background:#0a0a0a}
    table.data tbody tr:hover td{background:rgba(255,160,40,.05)}
    table.data td.nm{font-family:var(--sans);font-weight:650;color:var(--tx);text-align:left}
    table.data td.code{color:var(--mu);text-align:left}
    table.data .pos{color:var(--pos)} table.data .neg{color:var(--neg)}
    .empty-box{padding:18px 12px;border:var(--hair);background:#050505;color:var(--mu);font:12px/1.5 var(--mono);margin:0 0 12px}
    .foot-note{font:11px/1.5 var(--mono);color:var(--mu-2);margin:0 0 8px;padding:8px 10px;border:var(--hair);background:#050505}
    .scroll-hint{display:none;font:10px/1.3 var(--mono);color:var(--mu-3);margin:0 0 6px}
    .err{color:var(--pos);padding:16px;border:var(--hair)}
    .chart-box{
      border:var(--hair);background:#050505;margin-bottom:12px;padding:6px 4px 2px;
    }
    .chart-box .chart-hd{
      display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
      padding:4px 8px 6px;border-bottom:1px solid #1a1a1a;margin-bottom:4px
    }
    .chart-box .chart-hd h3{margin:0;font-size:12px;color:var(--bb);letter-spacing:.04em}
    .chart-box .chart-hd .sub{font-size:10px;color:var(--mu-2);font-family:var(--mono)}
    .chart-box .chart-hd .hd-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
    .chart-box .style-seg,
    .chart-box .chip-seg,
    .chart-box .range-seg{
      display:flex;flex-wrap:wrap;gap:0;border:var(--hair);background:var(--bd);width:fit-content;max-width:100%
    }
    .chart-box .range-seg{margin:0 8px 6px;max-width:calc(100% - 16px)}
    .chart-box .style-seg button,
    .chart-box .chip-seg button,
    .chart-box .range-seg button{
      appearance:none;border:0;border-right:var(--hair);background:#050505;color:var(--mu);
      font:650 10px/1 var(--mono);letter-spacing:.04em;padding:5px 9px;cursor:pointer
    }
    .chart-box .style-seg button:last-child,
    .chart-box .chip-seg button:last-child,
    .chart-box .range-seg button:last-child{border-right:0}
    .chart-box .style-seg button.active,
    .chart-box .chip-seg button.active,
    .chart-box .range-seg button.active{background:rgba(255,160,40,.12);color:var(--bb)}
    .chart-box .style-seg button:hover,
    .chart-box .chip-seg button:hover,
    .chart-box .range-seg button:hover{color:var(--tx)}
    .chart-box .hint{font:10px/1.4 var(--mono);color:var(--mu-2);padding:0 8px 4px}
    .chart-box .fine{font:10px/1.45 var(--mono);color:var(--mu-3);padding:4px 8px 8px}
    .chart-el{width:100%;height:320px}
    .view-toggle{display:flex;gap:0;border:var(--hair);margin:0 0 10px;background:var(--bd);width:100%}
    .view-toggle button{
      flex:1;background:#0a0a0a;color:var(--mu);border:0;border-right:var(--hair);
      font:inherit;font-size:12px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0
    }
    .view-toggle button:last-child{border-right:0}
    .view-toggle button .sub{display:block;font-size:10px;color:var(--mu-2);margin-top:2px;letter-spacing:.04em}
    .view-toggle button.on{background:#120c04;color:var(--bb);box-shadow:inset 0 -2px 0 var(--bb)}
    .view-toggle button.on .sub{color:#a07040}
    @media (max-width:719px){
      .kpi-bar{grid-template-columns:1fr}
      .kpi-bar .c{border-right:0;border-bottom:var(--hair)}
      .kpi-bar .c:last-child{border-bottom:0}
      .kpi-bar .v{font-size:15px}
      .page-title .title-note{display:block;margin:.15em 0 0;font-size:.68em}
      .scroll-hint{display:block}
      table.data{min-width:860px;font-size:11px}
      table.data.compact{min-width:640px}
      table.data th,table.data td{padding:5px 6px}
      .seg{width:100%}
      .seg button{flex:1 1 auto;padding:8px 10px}
      .chart-el{height:250px}
      .chart-box .style-seg,.chart-box .chip-seg{width:100%}
      .chart-box .style-seg button,.chart-box .chip-seg button{flex:1 1 auto;padding:6px 8px}
      .chart-box .range-seg{width:calc(100% - 16px);max-width:none}
      .chart-box .range-seg button{flex:1 1 auto;padding:6px 8px}
      .view-toggle{flex-wrap:wrap}
      .view-toggle button{font-size:11px;padding:7px 8px;flex:1 1 30%}
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand"><div class="brand-mark"></div><h1>GC的数据<span>监控</span>中心</h1></div>
      <nav class="nav">
        <a href="../" data-match="/">总览</a>
        <div class="nav-dd" data-match="/etf">
          <button type="button" class="nav-dd-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dd-etf">ETF<span class="nav-dd-caret" aria-hidden="true">▾</span></button>
          <div class="nav-dd-panel" id="nav-dd-etf" role="menu" aria-label="ETF">
            <a href="../etf/" role="menuitem">国家队追踪</a>
            <a href="../sentiment/" role="menuitem">情绪看板</a>
            <a href="../momentum/" role="menuitem">动量排名</a>
          </div>
        </div>
        <a href="../feed/" data-match="/feed">信息流</a>
        <a href="../bottom/" data-match="/bottom">抄底信号</a>
        <a href="../policy/" data-match="/policy">政策产业</a>
        <a href="../earnings/" data-match="/earnings">财报会议</a>
        <a href="../openrouter/" data-match="/openrouter">OpenRouter</a>
        <div class="nav-dd" data-match="/funds">
          <button type="button" class="nav-dd-btn active" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dd-funds">基金数据<span class="nav-dd-caret" aria-hidden="true">▾</span></button>
          <div class="nav-dd-panel" id="nav-dd-funds" role="menu" aria-label="基金数据">
            <a href="./" role="menuitem">公募基金</a>
            <a href="./?view=private" role="menuitem">私募基金</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">基金数据<span class="title-note" id="titleNote"></span><span class="sample-badge" id="sampleBadge" hidden>样例</span></h2>
    <p class="page-sub" id="sum">加载中…</p>

    <div id="content">
      <div class="kpi-bar" id="kpiBar" aria-label="基金 KPI"></div>
      <div class="view-toggle" id="mutualToc" hidden role="tablist" aria-label="公募仓位"></div>
      <div id="mutualRoot" hidden></div>
      <div class="seg" id="tableSeg" hidden role="tablist" aria-label="私募三表"></div>
      <div class="chart-box" id="chartBox" hidden>
        <div class="chart-hd">
          <div class="hd-left">
            <h3 id="chartTitle">SERIES</h3>
            <div class="style-seg" id="styleSeg" hidden role="tablist" aria-label="风格页签"></div>
          </div>
          <span class="sub" id="chartMeta"></span>
        </div>
        <div class="range-seg" id="rangeSeg" hidden role="tablist" aria-label="区间"></div>
        <div class="chart-el" id="chartEl"></div>
      </div>
      <div class="tbl-cap" id="tblCap" hidden>
        <span class="t" id="tblTitle"></span>
        <span id="tblMeta"></span>
      </div>
      <p class="scroll-hint" id="scrollHint">← 左右滑动查看更多列</p>
      <div class="tw" id="tblWrap">
        <table class="data" id="tbl">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty-box" id="emptyBox" hidden>暂无数据</div>
      <p class="foot-note" id="tblNote" hidden></p>
      <p class="foot-note" id="footNote" hidden></p>
    </div>
  </main>
  <footer class="app-footer">RESEARCH ONLY · LXWFOF POSITION SERIES · GC DATA</footer>

  <script src="../assets/shell.js"></script>
  <script src="../assets/echarts.min.js"></script>
  <script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  const VIEWS = {
    mutual: { file: "data/mutual.json", label: "公募基金", codeHead: "代码", typeHead: "类型", typeKey: "category", hasRank: true },
    private: { file: "data/private.json", label: "私募基金", codeHead: "备案号/代码", typeHead: "策略", typeKey: "strategy", hasRank: false },
  };
  const TABLE_ORDER = ["absolute", "excess", "style"];
  const TABLE_LABEL = { absolute: "绝对收益", excess: "超额收益", style: "风格持仓" };
  const STYLE_TAB_ORDER = ["300指增", "500指增", "1000指增", "2000指增", "A500指增"];
  const RANGE_ORDER = ["all", "3y", "1y", "2024"];
  const RANGE_LABEL = { all: "全样本", "3y": "近3年", "1y": "近1年", "2024": "2024至今" };

  const STRATEGY_COLORS = {
    "300指增": "#2F5BFF", "500指增": "#E53935", "1000指增": "#43A047",
    "2000指增": "#00897B", "A500指增": "#5C6BC0", "量选+小盘增强": "#FFA028",
    "中性": "#AB47BC", "宏观": "#29B6F6", "套利": "#EC407A", "量化CTA": "#9E9D24",
    "主观多头": "#FF7043", "主观公募": "#7E57C2", "期权": "#26A69A",
  };
  const NAME_COLOR = {
    "沪深300": "#64B5F6", "中证500": "#FFB74D", "中证1000": "#81C784",
    "中证2000": "#E57373", "万得微盘": "#BA68C8",
    "风格:红利": "#4DD0E1", "风格:双创": "#F06292", "风格:微盘": "#EF5350",
    "小微盘": "#90A4AE",
    "A股总仓位": "#FFA028", "港股": "#A1887F", "美股": "#78909C",
    "总股票仓位": "#E0E0E0", "总仓位": "#E0E0E0", "其他": "#607D8B", "未拆分": "#546E7A",
  };
  const STYLE_NEUTRAL_COLORS = [
    "#FFA028", "#64B5F6", "#90A4AE", "#FFB74D", "#78909C",
    "#A1887F", "#4DB6AC", "#B0BEC5", "#FFCC80", "#81D4FA",
  ];
  const PERF_FALLBACK = (window.DashTheme && DashTheme.colors) || [
    "#ffa028", "#ef5350", "#26a69a", "#ffb74d", "#64b5f6", "#a0a0a0",
  ];
  const MAX_POINTS = 220;

  const params = new URLSearchParams(location.search);
  const view = params.get("view") === "private" ? "private" : "mutual";
  let cache = { mutual: null, private: null };
  let activeTableId = params.get("table") || "absolute";
  if (!TABLE_ORDER.includes(activeTableId)) activeTableId = "absolute";
  let activeStyleTab = "300指增";
  let activeRange = "all";
  let chartInst = null;
  let chartResizeBound = false;
  const mutualCharts = {};
  const mutualState = {};
  let activeMutualId = null;

  function fmtNum(v, d = 2) {
    if (v == null || Number.isNaN(+v)) return "—";
    return (+v).toLocaleString("zh-CN", { maximumFractionDigits: d, minimumFractionDigits: d });
  }
  function fmtPct(v, d = 1) {
    if (v == null || Number.isNaN(+v)) return "—";
    const n = +v;
    const s = n > 0 ? "+" : "";
    return s + n.toLocaleString("zh-CN", { maximumFractionDigits: d, minimumFractionDigits: d }) + "%";
  }
  function retCls(v) {
    if (v == null || Number.isNaN(+v) || +v === 0) return "";
    return +v > 0 ? "pos" : "neg";
  }
  function kpiCls(id, v) {
    if (id === "avg_mdd_1y") return "neg";
    if (id === "avg_ret_1y") return retCls(v) || "neu";
    return "neu";
  }
  function fmtKpiValue(k) {
    if (k == null || k.value == null || Number.isNaN(+k.value)) return "—";
    const unit = k.unit || "";
    if (unit === "%") return fmtPct(k.value, 1);
    const n = +k.value;
    const body = Number.isInteger(n)
      ? n.toLocaleString("zh-CN")
      : n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
    return body + (unit ? unit : "");
  }

  async function loadView(key) {
    if (cache[key]) return cache[key];
    const meta = VIEWS[key];
    const r = await fetch(meta.file, { cache: "no-store" });
    if (!r.ok) throw new Error(meta.label + " HTTP " + r.status);
    const d = await r.json();
    cache[key] = d;
    return d;
  }

  function isStrategyIndex(d) {
    if (d && d.universe === "strategy_index") return true;
    const funds = d && Array.isArray(d.funds) ? d.funds : [];
    return funds.length > 0 && funds.every((f) => f && f.kind === "strategy_index");
  }

  function privateTables(d) {
    if (!d || !Array.isArray(d.tables)) return [];
    const byId = {};
    d.tables.forEach((t) => { if (t && t.id) byId[t.id] = t; });
    return TABLE_ORDER.map((id) => byId[id]).filter(Boolean);
  }

  function mutualSections(d) {
    return (d && Array.isArray(d.sections)) ? d.sections.filter((s) => s && s.id) : [];
  }

  function hasSeries(series) {
    if (!series || typeof series !== "object") return false;
    return Object.keys(series).length > 0;
  }

  function seriesForTable(series, tableId) {
    if (!hasSeries(series)) return null;
    if (tableId === "absolute") {
      const dates = Array.isArray(series.dates) ? series.dates : [];
      const map = series.absolute && typeof series.absolute === "object" ? series.absolute : null;
      if (!dates.length || !map || !Object.keys(map).length) return null;
      return { kind: "perf", dates, map, unit: "index", title: "绝对收益指数" };
    }
    if (tableId === "excess") {
      const dates = Array.isArray(series.dates) ? series.dates : [];
      const map = series.excess && typeof series.excess === "object" ? series.excess : null;
      if (!dates.length || !map || !Object.keys(map).length) return null;
      return { kind: "perf", dates, map, unit: "index", title: "超额收益指数" };
    }
    if (tableId === "style") {
      const dates = Array.isArray(series.styleDates) ? series.styleDates : [];
      const style = series.style && typeof series.style === "object" ? series.style : null;
      if (!dates.length || !style || !Object.keys(style).length) return null;
      return { kind: "style", dates, style, unit: "%", title: "风格持仓" };
    }
    return null;
  }

  function parseDate(s) {
    if (!s) return null;
    const t = Date.parse(String(s).slice(0, 10));
    return Number.isNaN(t) ? null : t;
  }

  function rangeStartMs(rangeId, endMs) {
    if (rangeId === "all" || endMs == null) return null;
    const d = new Date(endMs);
    if (rangeId === "3y") { d.setFullYear(d.getFullYear() - 3); return d.getTime(); }
    if (rangeId === "1y") { d.setFullYear(d.getFullYear() - 1); return d.getTime(); }
    if (rangeId === "2024") return Date.parse("2024-01-01");
    return null;
  }

  function filterByRange(dates, seriesMap, rangeId) {
    const n = dates.length;
    if (!n) return { dates: [], map: {}, idx: [] };
    let endMs = parseDate(dates[n - 1]);
    const startMs = rangeStartMs(rangeId, endMs);
    const idx = [];
    for (let i = 0; i < n; i++) {
      const t = parseDate(dates[i]);
      if (startMs != null && t != null && t < startMs) continue;
      idx.push(i);
    }
    if (!idx.length) idx.push(n - 1);
    const outDates = idx.map((i) => dates[i]);
    const outMap = {};
    Object.keys(seriesMap || {}).forEach((k) => {
      const arr = seriesMap[k];
      if (!Array.isArray(arr)) return;
      outMap[k] = idx.map((i) => (i < arr.length ? arr[i] : null));
    });
    return { dates: outDates, map: outMap, idx };
  }

  function downsample(dates, seriesMap, step) {
    const n = dates.length;
    if (n <= MAX_POINTS || step < 2) return { dates, map: seriesMap };
    const keep = [];
    for (let i = 0; i < n; i += step) keep.push(i);
    if (keep[keep.length - 1] !== n - 1) keep.push(n - 1);
    const outDates = keep.map((i) => dates[i]);
    const outMap = {};
    Object.keys(seriesMap || {}).forEach((k) => {
      const arr = seriesMap[k];
      if (!Array.isArray(arr)) return;
      outMap[k] = keep.map((i) => (i < arr.length ? arr[i] : null));
    });
    return { dates: outDates, map: outMap };
  }

  function colorForName(name, i) {
    return NAME_COLOR[name] || STRATEGY_COLORS[name] || STYLE_NEUTRAL_COLORS[i % STYLE_NEUTRAL_COLORS.length] || PERF_FALLBACK[i % PERF_FALLBACK.length];
  }
  function colorForStrategy(name, i) {
    return STRATEGY_COLORS[name] || PERF_FALLBACK[i % PERF_FALLBACK.length];
  }

  function ensureChart() {
    const el = $("chartEl");
    if (!el || !window.echarts) return null;
    if (!chartInst) {
      const base = (window.DashTheme && DashTheme.echartsDark) || {};
      try {
        echarts.registerTheme("funds-dark", Object.assign({}, base, {
          color: PERF_FALLBACK, backgroundColor: "transparent",
        }));
      } catch (_) {}
      chartInst = echarts.init(el, "funds-dark", { renderer: "canvas" });
    }
    if (!chartResizeBound) {
      chartResizeBound = true;
      window.addEventListener("resize", () => {
        if (chartInst) chartInst.resize();
        Object.keys(mutualCharts).forEach((id) => {
          try { mutualCharts[id].resize(); } catch (_) {}
        });
      });
    }
    return chartInst;
  }

  function hideChart() {
    const box = $("chartBox");
    if (box) box.hidden = true;
    const rs = $("rangeSeg");
    if (rs) { rs.hidden = true; rs.innerHTML = ""; }
    const ss = $("styleSeg");
    if (ss) { ss.hidden = true; ss.innerHTML = ""; }
    if (chartInst) { try { chartInst.clear(); } catch (_) {} }
  }

  function hideFundsTable() {
    $("tblWrap").hidden = true;
    $("tblCap").hidden = true;
    $("tblNote").hidden = true;
    $("emptyBox").hidden = true;
    $("scrollHint").style.display = "none";
    $("thead").innerHTML = "";
    $("tbody").innerHTML = "";
  }

  function buildLineOption({ dates, map, names, colors, yName, valueSuffix, defaultOff }) {
    const selected = {};
    (defaultOff || []).forEach((n) => { selected[n] = false; });
    const series = names.map((name, i) => ({
      name,
      type: "line",
      showSymbol: false,
      symbol: "circle",
      symbolSize: 6,
      sampling: "lttb",
      connectNulls: true,
      lineStyle: { width: 1.6, color: colors[i] },
      itemStyle: { color: colors[i] },
      emphasis: { focus: "series" },
      data: (map[name] || []).map((v) => (v == null || Number.isNaN(+v) ? null : +v)),
    }));
    let zoomStart;
    if (dates.length && String(dates[0]) < "2023-01-01") {
      zoomStart = dates.find((d) => String(d) >= "2023-01-01");
    }
    return {
      backgroundColor: "transparent",

      animationDuration: 280,
      tooltip: {
        trigger: "axis",
        backgroundColor: "rgba(0,0,0,.92)",
        borderColor: "#2b2b2b",
        textStyle: { color: "#e8e8e8", fontSize: 11 },
        confine: true,
        valueFormatter: (v) => {
          if (v == null || Number.isNaN(+v)) return "—";
          const body = (+v).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
          return valueSuffix ? body + valueSuffix : body;
        },
      },
      legend: {
        type: "scroll", top: 0, selectedMode: true,
        selected: Object.keys(selected).length ? selected : undefined,
        textStyle: { color: "#a0a0a0", fontSize: 10 },
        pageTextStyle: { color: "#a0a0a0" },
        pageIconColor: "#FFA028", pageIconInactiveColor: "#555",
      },
      grid: { left: 8, right: 12, top: 42, bottom: 52, containLabel: true },
      dataZoom: [
        { type: "inside", startValue: zoomStart, brushSelect: false },
        { type: "slider", height: 18, bottom: 8, startValue: zoomStart, brushSelect: false,
          borderColor: "#2b2b2b", fillerColor: "rgba(255,160,40,.18)",
          handleStyle: { color: "#FFA028" }, textStyle: { color: "#787878", fontSize: 9 } },
      ],
      xAxis: {
        type: "category", data: dates, boundaryGap: false,
        axisLabel: { color: "#a0a0a0", fontSize: 10, hideOverlap: true,
          formatter: (v) => (v ? String(v).slice(0, 10) : "") },
        axisLine: { lineStyle: { color: "#2b2b2b" } },
        axisTick: { show: false }, splitLine: { show: false },
      },
      yAxis: {
        type: "value", name: yName || "", scale: true,
        nameTextStyle: { color: "#787878", fontSize: 10 },
        axisLabel: { color: "#a0a0a0", fontSize: 10 },
        splitLine: { lineStyle: { color: "#1a1a1a" } },
        axisLine: { show: false },
      },
      series,
    };
  }

  /* ---------- private chart (unchanged behaviour) ---------- */
  function renderRangeSeg() {
    const el = $("rangeSeg");
    if (!el) return;
    el.hidden = false;
    el.innerHTML = RANGE_ORDER.map((id) => {
      const active = id === activeRange ? " active" : "";
      return `<button type="button" role="tab" aria-selected="${id === activeRange}" data-id="${esc(id)}" class="${active.trim()}">${esc(RANGE_LABEL[id])}</button>`;
    }).join("");
    el.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeRange = btn.getAttribute("data-id") || "all";
        const d = cache.private;
        if (d) renderPrivateChart(d);
      });
    });
  }

  function renderStyleSeg(styleObj) {
    const el = $("styleSeg");
    if (!el) return;
    const keys = STYLE_TAB_ORDER.filter((k) => styleObj && styleObj[k]);
    const extra = Object.keys(styleObj || {}).filter((k) => !keys.includes(k));
    const tabs = keys.concat(extra);
    if (!tabs.length) { el.hidden = true; el.innerHTML = ""; return; }
    if (!tabs.includes(activeStyleTab)) activeStyleTab = tabs.includes("300指增") ? "300指增" : tabs[0];
    el.hidden = false;
    el.innerHTML = tabs.map((k) => {
      const active = k === activeStyleTab ? " active" : "";
      return `<button type="button" role="tab" aria-selected="${k === activeStyleTab}" data-id="${esc(k)}" class="${active.trim()}">${esc(k)}</button>`;
    }).join("");
    el.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeStyleTab = btn.getAttribute("data-id") || activeStyleTab;
        const d = cache.private;
        if (d) renderPrivateChart(d);
      });
    });
  }

  function renderPrivateChart(d) {
    if (view !== "private") { hideChart(); return; }
    const series = d && d.series;
    const pack = seriesForTable(series, activeTableId);
    const box = $("chartBox");
    if (!pack) { hideChart(); return; }
    box.hidden = false;
    renderRangeSeg();
    let dates, map, names, colors, yName, valueSuffix = "", title = pack.title, metaBits = [];
    if (pack.kind === "style") {
      renderStyleSeg(pack.style);
      const tab = pack.style[activeStyleTab] || pack.style[Object.keys(pack.style)[0]];
      if (!tab) { hideChart(); return; }
      const filtered = filterByRange(pack.dates, tab, activeRange);
      const sampled = downsample(filtered.dates, filtered.map, 4);
      dates = sampled.dates; map = sampled.map; names = Object.keys(map);
      colors = names.map((_, i) => STYLE_NEUTRAL_COLORS[i % STYLE_NEUTRAL_COLORS.length]);
      yName = "%"; valueSuffix = "%"; title = "风格持仓 · " + activeStyleTab;
      metaBits.push(activeStyleTab);
    } else {
      const ss = $("styleSeg");
      if (ss) { ss.hidden = true; ss.innerHTML = ""; }
      const filtered = filterByRange(pack.dates, pack.map, activeRange);
      const sampled = downsample(filtered.dates, filtered.map, 4);
      dates = sampled.dates; map = sampled.map;
      names = Object.keys(pack.map).filter((k) => map[k]);
      colors = names.map((n, i) => colorForStrategy(n, i));
      yName = pack.unit === "index" ? "点位" : "";
      if (series && series.base != null) metaBits.push("基期 " + series.base);
      if (series && series.baseDate) metaBits.push(series.baseDate);
    }
    metaBits.push(RANGE_LABEL[activeRange] || activeRange);
    if (dates.length) metaBits.push(dates[0] + "→" + dates[dates.length - 1]);
    metaBits.push(dates.length + " 点");
    $("chartTitle").textContent = title;
    $("chartMeta").textContent = metaBits.join(" · ");
    const chart = ensureChart();
    if (!chart) return;
    chart.setOption(buildLineOption({ dates, map, names, colors, yName, valueSuffix }), true);
    requestAnimationFrame(() => { try { chart.resize(); } catch (_) {} });
  }

  /* ---------- position sections（公募 / 私募共用 view-toggle） ---------- */
  function comboReweight(sec, selected) {
    const dates = sec.dates || [];
    const parts = sec.parts || {};
    const scales = sec.scales || {};
    const keys = Object.keys(parts[selected[0]] || sec.series || {});
    const map = {};
    keys.forEach((k) => {
      map[k] = dates.map((_, i) => {
        let acc = 0, w = 0;
        selected.forEach((c) => {
          const v = parts[c] && parts[c][k] ? parts[c][k][i] : null;
          const s = scales[c] ? scales[c][i] : null;
          if (v != null && s != null) { acc += s * v; w += s; }
        });
        return w > 0 ? +(acc / w).toFixed(2) : null;
      });
    });
    return map;
  }

  function resolveMutualPack(sec, st) {
    if (!sec) return null;
    if (sec.kind === "combo") {
      const chips = Array.isArray(st.chips) && st.chips.length ? st.chips : (sec.chips || []);
      const all = (sec.chips || []).length;
      const map = (chips.length === all) ? (sec.series || {}) : comboReweight(sec, chips);
      return { dates: sec.dates || [], map, defaultOff: sec.defaultOff || [], title: sec.title };
    }
    if (sec.kind === "single") {
      return { dates: sec.dates || [], map: sec.series || {}, defaultOff: sec.defaultOff || [], title: sec.title };
    }
    const tabs = sec.tabs || [];
    const tab = tabs.find((t) => t.id === st.tab) || tabs[0];
    if (!tab) return null;
    return {
      dates: tab.dates || [],
      map: tab.series || {},
      defaultOff: sec.defaultOff || [],
      title: sec.title + " · " + (tab.label || tab.id),
    };
  }

  function ensureMutualChart(secId, el) {
    if (!window.echarts || !el) return null;
    if (!mutualCharts[secId]) {
      const base = (window.DashTheme && DashTheme.echartsDark) || {};
      try {
        echarts.registerTheme("funds-dark", Object.assign({}, base, {
          color: PERF_FALLBACK, backgroundColor: "transparent",
        }));
      } catch (_) {}
      mutualCharts[secId] = echarts.init(el, "funds-dark", { renderer: "canvas" });
    }
    if (!chartResizeBound) {
      chartResizeBound = true;
      window.addEventListener("resize", () => {
        if (chartInst) chartInst.resize();
        Object.keys(mutualCharts).forEach((id) => {
          try { mutualCharts[id].resize(); } catch (_) {}
        });
      });
    }
    return mutualCharts[secId];
  }

  function paintMutualSection(sec) {
    const st = mutualState[sec.id];
    if (!st) return;
    const pack = resolveMutualPack(sec, st);
    const metaEl = document.getElementById("mmeta-" + sec.id);
    const chartEl = document.getElementById("mchart-" + sec.id);
    if (!pack || !chartEl) return;
    const filtered = filterByRange(pack.dates, pack.map, st.range || "all");
    const step = filtered.dates.length > 800 ? 4 : (filtered.dates.length > 400 ? 2 : 1);
    const sampled = downsample(filtered.dates, filtered.map, step);
    const names = Object.keys(pack.map).filter((k) => sampled.map[k]);
    const colors = names.map((n, i) => colorForName(n, i));
    const bits = [];
    if (sec.asOf) bits.push("asOf " + sec.asOf);
    bits.push(RANGE_LABEL[st.range] || st.range);
    if (sampled.dates.length) bits.push(sampled.dates[0] + "→" + sampled.dates[sampled.dates.length - 1]);
    bits.push(sampled.dates.length + " 点");
    if (sec.kind === "combo" && st.chips) bits.push("成分 " + st.chips.join("+"));
    if (metaEl) metaEl.textContent = bits.join(" · ");
    const chart = ensureMutualChart(sec.id, chartEl);
    if (!chart) return;
    chart.setOption(buildLineOption({
      dates: sampled.dates,
      map: sampled.map,
      names,
      colors,
      yName: "%",
      valueSuffix: "%",
      defaultOff: pack.defaultOff,
    }), true);
    requestAnimationFrame(() => { try { chart.resize(); } catch (_) {} });
  }

  function renderMutual(d) {
    const sections = mutualSections(d);
    const root = $("mutualRoot");
    const toc = $("mutualToc");
    Object.keys(mutualCharts).forEach((id) => {
      try { mutualCharts[id].dispose(); } catch (_) {}
      delete mutualCharts[id];
    });
    if (!sections.length) {
      root.hidden = true; root.innerHTML = "";
      toc.hidden = true; toc.innerHTML = "";
      return false;
    }
    hideChart();
    hideFundsTable();
    $("tableSeg").hidden = true;
    $("tableSeg").innerHTML = "";
    toc.setAttribute("aria-label", view === "private" ? "私募仓位" : "公募仓位");
    const hash = (location.hash || "").replace(/^#/, "");
    const hashed = hash && sections.find((s) => s.anchor === hash || s.id === hash);
    if (hashed) activeMutualId = hashed.id;
    else if (!sections.some((s) => s.id === activeMutualId)) activeMutualId = sections[0].id;
    toc.hidden = false;
    toc.innerHTML = sections.map((s) => {
      const on = s.id === activeMutualId;
      const sub = s.asOf ? "asOf " + s.asOf : "";
      return `<button type="button" role="tab" data-sid="${esc(s.id)}" class="${on ? "on" : ""}" aria-selected="${on}">${esc(s.title || s.id)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</button>`;
    }).join("");
    root.hidden = false;
    root.innerHTML = sections.map((sec) => {
      const st = mutualState[sec.id] || (mutualState[sec.id] = {
        range: "all",
        tab: sec.defaultTab || (sec.tabs && sec.tabs[0] && sec.tabs[0].id) || null,
        chips: (sec.chips || []).slice(),
      });
      let tabsHtml = "";
      if (sec.kind === "combo") {
        tabsHtml = `<div class="chip-seg" data-role="chips" data-sid="${esc(sec.id)}">${(sec.chips || []).map((c) => {
          const on = st.chips.indexOf(c) >= 0;
          return `<button type="button" data-chip="${esc(c)}" class="${on ? "active" : ""}" aria-pressed="${on}">${esc(c)}</button>`;
        }).join("")}</div>`;
      } else if (sec.tabs && sec.tabs.length) {
        tabsHtml = `<div class="style-seg" data-role="tabs" data-sid="${esc(sec.id)}">${sec.tabs.map((t) => {
          const on = t.id === st.tab;
          return `<button type="button" data-tab="${esc(t.id)}" class="${on ? "active" : ""}" aria-selected="${on}">${esc(t.label || t.id)}</button>`;
        }).join("")}</div>`;
      }
      const rangeHtml = `<div class="range-seg" data-role="range" data-sid="${esc(sec.id)}">${RANGE_ORDER.map((id) => {
        const on = (st.range || "all") === id;
        return `<button type="button" data-range="${esc(id)}" class="${on ? "active" : ""}">${esc(RANGE_LABEL[id])}</button>`;
      }).join("")}</div>`;
      const fine = [];
      if (sec.hint) fine.push(sec.hint);
      if (sec.accuracy && sec.accuracy.text) fine.push(sec.accuracy.text);
      if (sec.note) fine.push(sec.note);
      const shown = sec.id === activeMutualId ? "" : " hidden";
      return `<section class="chart-box" data-sid="${esc(sec.id)}" id="${esc(sec.anchor || sec.id)}"${shown}>
        <div class="chart-hd">
          <div class="hd-left">
            <h3>${esc(sec.title || sec.id)}</h3>
            ${tabsHtml}
          </div>
          <span class="sub" id="mmeta-${esc(sec.id)}"></span>
        </div>
        ${rangeHtml}
        <div class="chart-el" id="mchart-${esc(sec.id)}"></div>
        ${fine.length ? `<div class="fine">${esc(fine.join(" · "))}</div>` : ""}
      </section>`;
    }).join("");

    root.querySelectorAll("[data-role=tabs] button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sid = btn.parentElement.getAttribute("data-sid");
        const sec = sections.find((s) => s.id === sid);
        if (!sec) return;
        mutualState[sid].tab = btn.getAttribute("data-tab");
        btn.parentElement.querySelectorAll("button").forEach((b) => {
          const on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });
        paintMutualSection(sec);
      });
    });
    root.querySelectorAll("[data-role=chips] button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sid = btn.parentElement.getAttribute("data-sid");
        const sec = sections.find((s) => s.id === sid);
        if (!sec) return;
        const chip = btn.getAttribute("data-chip");
        const arr = mutualState[sid].chips || [];
        const i = arr.indexOf(chip);
        if (i >= 0) {
          if (arr.length === 1) return; // keep at least one
          arr.splice(i, 1);
          btn.classList.remove("active");
          btn.setAttribute("aria-pressed", "false");
        } else {
          arr.push(chip);
          btn.classList.add("active");
          btn.setAttribute("aria-pressed", "true");
        }
        mutualState[sid].chips = arr;
        paintMutualSection(sec);
      });
    });
    root.querySelectorAll("[data-role=range] button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sid = btn.parentElement.getAttribute("data-sid");
        const sec = sections.find((s) => s.id === sid);
        if (!sec) return;
        mutualState[sid].range = btn.getAttribute("data-range") || "all";
        btn.parentElement.querySelectorAll("button").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        paintMutualSection(sec);
      });
    });

    toc.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sid = btn.getAttribute("data-sid");
        const sec = sections.find((s) => s.id === sid);
        if (!sec) return;
        activeMutualId = sid;
        toc.querySelectorAll("button").forEach((b) => {
          const on = b === btn;
          b.classList.toggle("on", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });
        root.querySelectorAll(":scope > section").forEach((el) => {
          el.hidden = el.getAttribute("data-sid") !== sid;
        });
        paintMutualSection(sec);
        const chart = mutualCharts[sid];
        requestAnimationFrame(() => { try { if (chart) chart.resize(); } catch (_) {} });
      });
    });

    const current = sections.find((s) => s.id === activeMutualId) || sections[0];
    if (current) paintMutualSection(current);
    return true;
  }

  function renderSub(d) {
    const sections = mutualSections(d);
    const bits = [];
    if (d.generatedAtDisplay) bits.push("生成 " + d.generatedAtDisplay);
    if (d.asOf) bits.push("asOf " + d.asOf);
    if (isStrategyIndex(d) && !sections.length) bits.push("策略指数");
    if (sections.length) bits.push("仓位图 " + sections.length);
    const tabs = privateTables(d);
    if (view === "private" && !sections.length && tabs.length) bits.push("三表 " + tabs.length);
    if (d.schemaVersion) bits.push(d.schemaVersion);
    $("sum").textContent = bits.join(" · ") || "—";
    // 公募标题只留「基金数据」：不写 titleNote，也不因 sample 显示角标。
    if (view !== "private") {
      $("titleNote").textContent = "";
      $("sampleBadge").hidden = true;
      return;
    }
    const noteBits = [sections.length ? "私募·仓位" : (isStrategyIndex(d) ? "私募·策略指数" : "私募")];
    if (d.asOf) noteBits.push("asOf " + d.asOf);
    $("titleNote").textContent = noteBits.join(" · ");
    $("sampleBadge").hidden = !d.sample;
  }

  function renderKpis(d) {
    const kpis = Array.isArray(d.kpis) ? d.kpis : [];
    if (!kpis.length) {
      $("kpiBar").innerHTML = "";
      $("kpiBar").hidden = true;
      return;
    }
    $("kpiBar").hidden = false;
    $("kpiBar").innerHTML = kpis.map((k) => {
      const cls = kpiCls(k.id, k.value);
      return `<div class="c"><div class="k">${esc(k.label || k.id)}</div><div class="v ${cls}">${esc(fmtKpiValue(k))}</div><div class="d">${esc(k.note || "")}</div></div>`;
    }).join("");
  }

  function cellFor(col, row) {
    const key = col.key;
    const v = row[key];
    const fmt = col.format || "";
    const left = (col.align === "left") || key === "code" || key === "name" || key === "strategy" || key === "benchmark" || key === "fullName";
    if (key === "code" || key === "thscode") return `<td class="code">${esc(v || "—")}</td>`;
    if (key === "name" || key === "strategy") return `<td class="nm" title="${esc(row.fullName || row.name || "")}">${esc(v || "—")}</td>`;
    if (fmt === "pct1" || /^(ret|mdd)/.test(key)) {
      const cls = key === "mdd1y" ? "neg" : retCls(v);
      return `<td class="${cls}">${fmtPct(v, 1)}</td>`;
    }
    if (fmt === "num2" || key === "level" || key === "nav") return `<td>${fmtNum(v, 2)}</td>`;
    if (left) return `<td class="l">${esc(v == null || v === "" ? "—" : v)}</td>`;
    if (typeof v === "number") return `<td>${fmtNum(v, 2)}</td>`;
    return `<td>${esc(v == null || v === "" ? "—" : v)}</td>`;
  }

  function renderGenericTable(table) {
    const cols = Array.isArray(table.columns) ? table.columns : [];
    const rows = Array.isArray(table.rows) ? table.rows : [];
    const empty = !rows.length;
    $("tblWrap").hidden = empty;
    $("emptyBox").hidden = !empty;
    $("scrollHint").style.display = "";
    $("tbl").classList.toggle("compact", table.id === "style" || rows.length <= 5);
    if (empty) {
      $("emptyBox").textContent = "暂无「" + (table.title || table.id) + "」数据";
      $("thead").innerHTML = ""; $("tbody").innerHTML = "";
      return;
    }
    $("thead").innerHTML = "<tr>" + cols.map((c) => {
      const cls = (c.align === "left" || c.key === "code" || c.key === "name" || c.key === "strategy") ? ' class="l"' : "";
      return `<th${cls}>${esc(c.label || c.key)}</th>`;
    }).join("") + "</tr>";
    $("tbody").innerHTML = rows.map((row) => "<tr>" + cols.map((c) => cellFor(c, row)).join("") + "</tr>").join("");
  }

  function renderFundsFallback(d) {

    const funds = Array.isArray(d.funds) ? d.funds : [];

    $("tblWrap").hidden = empty;
    $("emptyBox").hidden = !empty;
    $("scrollHint").style.display = "";
    $("tbl").classList.remove("compact");
    if (empty) {
      $("emptyBox").textContent = "暂无" + (strat ? "策略指数" : meta.label) + "数据（funds 为空）";
      $("thead").innerHTML = ""; $("tbody").innerHTML = "";
      return;

    const codeHead = strat ? "指数代码" : meta.codeHead;

    if (!strat && meta.hasRank) heads.push("同类排名");

      const cls = (i <= leftN) ? ' class="l"' : "";

    }).join("") + "</tr>";
    $("tbody").innerHTML = funds.map((f) => {

          `<td class="l">${esc(typeVal)}</td>`,
          `<td class="l">${esc(f.company || "—")}</td>`,

          `<td class="${retCls(f.retYtd)}">${fmtPct(f.retYtd, 1)}</td>`,
          `<td class="neg">${fmtPct(f.mdd1y, 1)}</td>`,
        ];
      } else {
        cells = [
          `<td class="code">${esc(f.code || "—")}</td>`,
          `<td class="nm" title="${esc(f.fullName || f.name || "")}">${esc(f.name || "—")}</td>`,
          `<td class="l">${esc(typeVal)}</td>`,
          `<td class="l">${esc(f.company || "—")}</td>`,
          `<td class="l">${esc(f.manager || "—")}</td>`,
          `<td>${fmtNum(f.nav, navDigits)}</td>`,
          `<td class="${retCls(f.ret1m)}">${fmtPct(f.ret1m, 1)}</td>`,
          `<td class="${retCls(f.ret3m)}">${fmtPct(f.ret3m, 1)}</td>`,
          `<td class="${retCls(f.ret1y)}">${fmtPct(f.ret1y, 1)}</td>`,
          `<td class="${retCls(f.retYtd)}">${fmtPct(f.retYtd, 1)}</td>`,
          `<td class="neg">${fmtPct(f.mdd1y, 1)}</td>`,
          `<td>${f.aumYi == null || Number.isNaN(+f.aumYi) ? "—" : fmtNum(f.aumYi, 1)}</td>`,
        ];
        if (meta.hasRank) cells.push(`<td>${esc(f.rank1y || "—")}</td>`);
      }
      return "<tr>" + cells.join("") + "</tr>";
    }).join("");
  }

  function setTableUrl(id) {
    const u = new URL(location.href);
    if (view === "private") u.searchParams.set("view", "private");
    else u.searchParams.delete("view");
    if (id && id !== "absolute") u.searchParams.set("table", id);
    else u.searchParams.delete("table");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }

  function renderTableSeg(tabs) {
    const el = $("tableSeg");
    if (view !== "private" || !tabs.length) {
      el.hidden = true; el.innerHTML = ""; return;
    }
    el.hidden = false;
    el.innerHTML = tabs.map((t) => {
      const id = t.id;
      const label = t.title || TABLE_LABEL[id] || id;
      const n = Array.isArray(t.rows) ? t.rows.length : (t.rowCount || 0);
      const active = id === activeTableId ? " active" : "";
      return `<button type="button" role="tab" aria-selected="${id === activeTableId}" data-id="${esc(id)}" class="${active.trim()}">${esc(label)} · ${n}</button>`;
    }).join("");
    el.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTableId = btn.getAttribute("data-id");
        setTableUrl(activeTableId);
        render(cache.private);
      });
    });
  }

  function renderActivePrivateTable(d) {
    const tabs = privateTables(d);
    renderTableSeg(tabs);
    renderPrivateChart(d);
    if (!tabs.length) {
      $("tblCap").hidden = true; $("tblNote").hidden = true;
      renderFundsFallback(d);
      return;
    }
    let table = tabs.find((t) => t.id === activeTableId) || tabs[0];
    activeTableId = table.id;
    $("tblCap").hidden = false;
    $("tblTitle").textContent = table.title || TABLE_LABEL[table.id] || table.id;
    const metaBits = [];
    if (table.rowCount != null || (table.rows && table.rows.length)) metaBits.push((table.rowCount != null ? table.rowCount : table.rows.length) + " 行");
    if (table.asOf || d.asOf) metaBits.push("asOf " + (table.asOf || d.asOf));
    if (table.unit) metaBits.push("单位 " + table.unit);
    if (table.base != null) metaBits.push("基期 " + table.base);
    $("tblMeta").textContent = metaBits.join(" · ");
    if (table.note) { $("tblNote").hidden = false; $("tblNote").textContent = table.note; }
    else { $("tblNote").hidden = true; $("tblNote").textContent = ""; }
    renderGenericTable(table);
  }

  function renderNote(d) {
    const el = $("footNote");
    if (!d.note) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = d.note;
  }

  function render(d) {
    renderSub(d);
    renderKpis(d);
    // 有 sections 时公募、私募共用 renderMutual（页顶 view-toggle，同时只画一块）。
    // 私募无 sections 才回退旧三表 / funds；公募无 sections 回退观察池密表。
    if (mutualSections(d).length) {
      renderMutual(d);
    } else if (view === "private") {
      $("mutualRoot").hidden = true; $("mutualRoot").innerHTML = "";
      $("mutualToc").hidden = true; $("mutualToc").innerHTML = "";
      renderActivePrivateTable(d);
    } else {
      $("tableSeg").hidden = true; $("tableSeg").innerHTML = "";
      $("tblCap").hidden = true; $("tblNote").hidden = true;
      hideChart();
      renderFundsFallback(d);
    }
    renderNote(d);
  }

  async function main() {
    $("sum").textContent = "加载 " + VIEWS[view].file + " …";
    try {
      const d = await loadView(view);
      render(d);
    } catch (e) {
      $("sum").innerHTML = `<span class="err">加载失败：${esc(e.message || e)}（请用 http server 打开本页）</span>`;
    }
  }

  main();
})();
  </script>
</body>
</html>
