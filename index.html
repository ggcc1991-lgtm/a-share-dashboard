<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GC的数据监控中心</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body class="page-home">
  <header class="app-header">
    <div class="inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1>GC的数据<span>监控</span>中心</h1>
      </div>
            <nav class="nav">
        <a href="./" data-match="/" class="active">总览</a>
        <a href="etf/" data-match="/etf">ETF</a>
        <a href="feed/" data-match="/feed">信息流</a>
        <a href="bottom/" data-match="/bottom">抄底信号</a>
        <a href="policy/" data-match="/policy">政策产业</a>
      </nav>
      <div class="header-meta" id="clock"></div>
    </div>
  </header>

  <div class="bb-strip" id="strip"></div>

  <main class="wrap">
    <div class="bb-cols" id="mainCols">
      <section>
        <div class="bb-sec"><h2>抄底信号</h2><a class="more" href="bottom/">完整面板 →</a></div>
        <div class="bb-ind" id="bottomBox">加载中…</div>
      </section>
      <section>
        <div class="bb-sec"><h2>最新要闻</h2><a class="more" href="feed/">全部 →</a></div>
        <div class="bb-list">
          <div class="hd"><span>HEADLINES</span><span id="feedMeta" class="mu mono"></span></div>
          <div class="bd headline-list" id="headlines"></div>
        </div>
      </section>
      <section>
        <div class="bb-sec"><h2>政策产业</h2><a class="more" href="policy/">全部 →</a></div>
        <div class="bb-score" id="policyBox" style="margin-bottom:12px">加载中…</div>
        <div class="bb-sec"><h2>ETF 资金</h2><a class="more" href="etf/">明细 →</a></div>
        <div class="bb-score" id="etfBox">加载中…</div>
        <div class="bb-sec" style="margin-top:14px"><h2>模块</h2></div>
        <div class="bb-list" id="modules"></div>
      </section>
    </div>
  </main>

  <footer class="app-footer">RESEARCH ONLY · NOT INVESTMENT ADVICE · GC DATA</footer>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    const SRC = { mp: "公众号", x: "X", zsxq: "星球", rss: "RSS", feishu: "飞书" };
    document.getElementById("clock").textContent =
      new Date().toLocaleString("zh-CN", { hour12: false, timeZone: "Asia/Shanghai" });

    async function loadJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url);
      return r.json();
    }
    function band(n, bottom) {
      const v = bottom?.verdict?.band;
      if (v?.label) return [v.label, n >= 10 ? "hot" : n >= 6 ? "warn" : ""];
      if (n >= 10) return ["高度警戒抄底区", "hot"];
      if (n >= 9) return ["持仓耐心等", "warn"];
      if (n >= 6) return ["空仓可考虑", "warn"];
      return ["观望", ""];
    }
    function fmtIndVal(x) {
      if (x == null || x === "") return "—";
      if (typeof x === "number") return DashFmt.num(x, 2);
      return String(x);
    }
    function clsFlow(v) {
      return v > 0 ? "pos" : v < 0 ? "neg" : "";
    }


    let _scoreChart = null;
    function disposeScoreChart() {
      if (_scoreChart) { try { _scoreChart.dispose(); } catch (_) {} _scoreChart = null; }
    }
    async function initScoreSpark() {
      const el = document.getElementById("scoreSpark");
      if (!el || typeof echarts === "undefined") return;
      disposeScoreChart();
      let hist = null;
      try { hist = await loadJSON("data/history.json"); } catch (_) {}
      const series = Array.isArray(hist?.score) ? hist.score : [];
      const pts = series
        .filter((x) => x && x.d != null && x.v != null && !Number.isNaN(+x.v))
        .slice(-30);
      if (!pts.length) {
        el.innerHTML = `<div class="bb-spark-empty">待抄底写入 history.score</div>`;
        return;
      }
      _scoreChart = echarts.init(el, null, { renderer: "canvas" });
      const dates = pts.map((x) => x.d);
      const vals = pts.map((x) => +x.v);
      _scoreChart.setOption({
        backgroundColor: "transparent",
        grid: { left: 28, right: 8, top: 8, bottom: 18, containLabel: false },
        xAxis: {
          type: "category",
          data: dates,
          boundaryGap: false,
          axisLine: { lineStyle: { color: "#2b2b2b" } },
          axisTick: { show: false },
          axisLabel: {
            color: "#787878",
            fontSize: 9,
            interval: Math.max(0, Math.floor(dates.length / 5) - 1),
            formatter: (d) => String(d).slice(5),
          },
          splitLine: { show: false },
        },
        yAxis: {
          type: "value",
          min: 0,
          max: 12,
          interval: 1,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: {
            color: "#787878",
            fontSize: 9,
            formatter: (v) => ([0, 5, 8, 9, 12].includes(v) ? String(v) : ""),
          },
          splitLine: {
            show: true,
            lineStyle: { color: "#1a1a1a", type: "solid", width: 1 },
          },
        },
        tooltip: {
          trigger: "axis",
          backgroundColor: "#0a0a0a",
          borderColor: "#2b2b2b",
          textStyle: { color: "#e8e8e8", fontSize: 11 },
          formatter: (params) => {
            const p = params?.[0];
            if (!p) return "";
            return `${p.axisValue}<br/>红线 <b style="color:#FFA028">${p.data}</b>/12`;
          },
        },
        series: [{
          type: "line",
          data: vals,
          showSymbol: false,
          symbol: "circle",
          symbolSize: 3,
          lineStyle: { color: "#FFA028", width: 1.5 },
          itemStyle: { color: "#FFA028" },
          areaStyle: { color: "rgba(255,160,40,0.08)" },
        }],
      });
      const onResize = () => { if (_scoreChart) _scoreChart.resize(); };
      window.removeEventListener("resize", window.__scoreSparkResize);
      window.__scoreSparkResize = onResize;
      window.addEventListener("resize", onResize);
    }

    (async () => {
      let etf = null, bottom = null, feed = null;
      try { etf = await loadJSON("data/etf.json"); } catch (_) {}
      try { bottom = await loadJSON("data/bottom.json"); } catch (_) {}
      try { feed = await loadJSON("data/feed.json"); } catch (_) {}
      let policy = null;
      try { policy = await loadJSON("policy/snapshot.json"); } catch (_) {}

      let flow1 = null, flow5 = null, flow20 = null, etfDate = "—";
      if (etf?.series && etf?.dates?.length) {
        const dates = etf.dates;
        etfDate = dates.at(-1);
        const sumAt = (i) => Object.values(etf.series).reduce((s, x) => s + (x.flow?.[i] ?? 0), 0);
        const win = (n) => {
          let s = 0, any = false;
          for (let i = Math.max(0, dates.length - n); i < dates.length; i++) {
            const v = sumAt(i); if (v != null) { s += v; any = true; }
          }
          return any ? s : null;
        };
        flow1 = win(1); flow5 = win(5); flow20 = win(20);
      }
      const trig = bottom?.triggered_count ?? 0;
      const total = bottom?.total ?? 12;
      const [label, hot] = band(trig, bottom);
      const items = feed?.items || [];

      document.getElementById("strip").innerHTML = `<div class="inner">
        <span><span class="k">信号</span><span class="v ${trig >= 6 ? "pos" : ""}">${trig}/${total}</span></span>
        <span class="sep">|</span>
        <span><span class="k">ETF日流入</span><span class="v ${clsFlow(flow1)}">${flow1 == null ? "—" : DashFmt.signed(flow1, 1)}亿</span></span>
        <span class="sep">|</span>
        <span><span class="k">5日</span><span class="v ${clsFlow(flow5)}">${flow5 == null ? "—" : DashFmt.signed(flow5, 1)}亿</span></span>
        <span class="sep">|</span>
        <span><span class="k">20日</span><span class="v ${clsFlow(flow20)}">${flow20 == null ? "—" : DashFmt.signed(flow20, 1)}亿</span></span>
        <span class="sep">|</span>
        <span><span class="k">信息流</span><span class="v">${items.length}</span></span>
        <span class="sep">|</span>
        <span><span class="k">政策</span><span class="v">${((policy?.materials||{}).policy||[]).length + ((policy?.materials||{}).media||[]).length}</span></span>
        <span class="sep">|</span>
        <span><span class="k">交易日</span><span class="v">${etfDate}</span></span>
      </div>`;

      const inds = bottom?.indicators || [];
      const watchN = inds.filter((x) => x.status === "watching").length;
      const ticks = Array.from({ length: total }, (_, i) => {
        const on = i < trig;
        return `<i class="${on ? (trig >= 10 ? "on" : "soft") : ""}"></i>`;
      }).join("");
      const sub = bottom?.verdict?.band?.rule || bottom?.verdict?.band?.sub || "";
      const rows = inds.map((x) => {
        const on = x.status === "triggered";
        const unit = x.unit ? ` ${x.unit}` : "";
        return `<div class="bb-ind-row ${on ? "is-on" : ""}">
          <span class="dot"></span>
          <span class="nm" title="${x.name || ""}">${x.name || "—"}</span>
          <span class="val">${fmtIndVal(x.value)}${unit}</span>
          <span class="st">${on ? "红线" : "观察"}</span>
        </div>`;
      }).join("");

      document.getElementById("bottomBox").innerHTML = `
        <div class="bb-ind-top">
          <div class="ratio ${hot}" id="heroBig">${trig}<span style="font-size:13px;color:#666">/${total}</span></div>
          <div class="bb-ind-top-main">
            <div class="band">${label}${sub ? `<small>${sub}</small>` : ""}</div>
            <div class="ticks">${ticks}</div>
          </div>
        </div>
        <div class="bb-spark" id="scoreSparkWrap">
          <div class="bb-spark-title">近30天信号变化</div>
          <div class="bb-spark-chart" id="scoreSpark"></div>
        </div>
        <div class="bb-ind-hd"><span>#</span><span>INDICATOR</span><span style="text-align:right">VALUE</span><span style="text-align:right">状态</span></div>
        ${rows || `<div class="mu" style="padding:8px 10px">暂无指标</div>`}
        <div class="bb-ind-foot">
          <span>触发 ${trig} · 观察 ${watchN}</span>
          <span class="mono">${bottom?.generated_at || bottom?.verdict?.generated_at || "—"}</span>
        </div>`;
      initScoreSpark();

      document.getElementById("feedMeta").textContent = feed?.updated || "";
      const top = [...items].sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt))).slice(0, 12);
      document.getElementById("headlines").innerHTML = top.map((x) => {
        const t = DashFmt.time(x.publishedAt).slice(11, 16) || "--:--";
        return `<a href="${x.url || "feed/"}" ${x.url && x.url !== "#" ? 'target="_blank" rel="noopener"' : ""}>
          <span class="mono" style="color:var(--mu-2)">${t}</span>
          <span class="t">${x.title}<em>${SRC[x.source] || x.source} · ${x.sourceName || ""}</em></span>
        </a>`;
      }).join("") || `<div class="empty">暂无</div>`;

      
      const polEl = document.getElementById("policyBox");
      if (polEl && policy) {
        const b = policy.brief || {};
        const mats = [...((policy.materials||{}).policy||[]), ...((policy.materials||{}).media||[])];
        const dyn = policy.dynamics || [];
        polEl.innerHTML = `
          <div style="font-size:12px;color:var(--bb);font-weight:700;margin-bottom:6px">${b.headline || "政策产业"}</div>
          <div style="font-size:11px;color:#a0a0a0;line-height:1.45;margin-bottom:8px">${(b.summary||"").slice(0,120)}${(b.summary||"").length>120?"…":""}</div>
          ${dyn.slice(0,4).map(x => `<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #1a1a1a;font-size:12px">
            <span style="color:var(--bb);min-width:56px">${x.type||"—"}</span>
            <span style="flex:1;color:#e8e8e8">${x.name||""}</span>
          </div>`).join("") || ""}`;
      } else if (polEl) {
        polEl.innerHTML = `<div class="mu">暂无截面</div>`;
      }
      const ph = document.getElementById("policyModHint");
      if (ph) {
        const n = ((policy?.materials||{}).policy||[]).length + ((policy?.materials||{}).media||[]).length;
        ph.textContent = `${n} 材料 · asOf ${policy?.meta?.asOf || "—"}`;
      }

      const holders = etf?.baseline?.holders || [];
      const holderSum = holders.reduce((s, h) => s + (h.shares_yi || 0), 0);
      document.getElementById("etfBox").innerHTML = `
        <div class="lab">NET FLOW · ${etfDate}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <div><div class="stat-label">1D</div><div class="stat-value ${clsFlow(flow1)}">${flow1 == null ? "—" : DashFmt.signed(flow1, 1)}</div></div>
          <div><div class="stat-label">5D</div><div class="stat-value ${clsFlow(flow5)}">${flow5 == null ? "—" : DashFmt.signed(flow5, 1)}</div></div>
          <div><div class="stat-label">20D</div><div class="stat-value ${clsFlow(flow20)}">${flow20 == null ? "—" : DashFmt.signed(flow20, 1)}</div></div>
          <div><div class="stat-label">汇金观察</div><div class="stat-value">${holderSum ? DashFmt.num(holderSum, 0) : "—"}</div></div>
        </div>
        <div class="stat-hint">${etf?.updated || ""} · 亿</div>`;

      document.getElementById("modules").innerHTML = `
        <a class="module-link" href="etf/"><strong>国家队 ETF</strong><div class="mu" style="font-size:11px;margin-top:4px">${(etf?.etfs || []).length} 只 · ${etf?.dates?.length || 0} 日</div><div class="go">OPEN</div></a>
        <a class="module-link" href="feed/" style="border-top:1px solid var(--bd)"><strong>信息聚合</strong><div class="mu" style="font-size:11px;margin-top:4px">${items.length} 条增量</div><div class="go">OPEN</div></a>
        <a class="module-link" href="policy/" style="border-top:1px solid var(--bd)"><strong>政策产业</strong><div class="mu" style="font-size:11px;margin-top:4px" id="policyModHint">—</div><div class="go">OPEN</div></a>
        <a class="module-link" href="bottom/" style="border-top:1px solid var(--bd)"><strong>抄底信号</strong><div class="mu" style="font-size:11px;margin-top:4px">${trig}/${total} · ${label}</div><div class="go">OPEN</div></a>`;
    })();
  </script>
</body>
</html>
