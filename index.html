<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GC的数据监控中心</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1>GC的数据<span>监控</span>中心</h1>
      </div>
      <nav class="nav">
        <a href="./" data-match="/" class="active">总览</a>
        <a href="etf/" data-match="/etf">ETF 追踪</a>
        <a href="feed/" data-match="/feed">信息聚合</a>
        <a href="bottom/" data-match="/bottom">抄底红线</a>
      </nav>
      <div class="header-meta" id="clock"></div>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">今日总览</h2>
    <p class="page-sub">ETF · 信息流 · 抄底红线</p>

    <div class="hero">
      <div class="panel hero-score" id="heroScore">
        <div class="mu" style="font-size:.75rem">抄底红线触发</div>
        <div class="big" id="heroBig">—</div>
        <div class="lbl" id="heroLbl">加载中</div>
        <div class="ladder" id="heroLadder"></div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <strong>最新信息流</strong>
          <a href="feed/" style="font-size:.8rem">查看全部 →</a>
        </div>
        <div class="headline-list" id="headlines" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="grid grid-4" id="kpis" style="margin-bottom:14px"></div>
    <div class="grid grid-3" id="modules"></div>
  </main>

  <footer class="app-footer">研究用途 · 非投资建议</footer>
  <script src="assets/shell.js"></script>
  <script>
    document.getElementById("clock").textContent =
      new Date().toLocaleString("zh-CN", { hour12: false, timeZone: "Asia/Shanghai" }) + " 北京时间";

    const SRC = { mp: "公众号", x: "X", zsxq: "星球", rss: "RSS", feishu: "飞书" };

    async function loadJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    }

    function band(n) {
      if (n >= 10) return ["抄底区", "hot"];
      if (n >= 9) return ["持仓耐心等", "warn"];
      if (n >= 6) return ["空仓可考虑", "warn"];
      return ["观望", ""];
    }

    function moduleCard({ href, title, badge, stats, desc }) {
      return `<a class="card module-link" href="${href}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <strong style="font-size:1.05rem">${title}</strong>${badge || ""}
        </div>
        <div style="margin-top:10px;display:grid;gap:6px">${stats}</div>
        <p class="mu" style="margin:10px 0 0;font-size:.8rem">${desc}</p>
        <div class="go">进入模块 →</div>
      </a>`;
    }

    (async () => {
      let etf = null, bottom = null, feed = null;
      try { etf = await loadJSON("data/etf.json"); } catch (_) {}
      try { bottom = await loadJSON("data/bottom.json"); } catch (_) {}
      try { feed = await loadJSON("data/feed.json"); } catch (_) {}

      let flowSum = null, etfDate = "—";
      if (etf?.series && etf?.dates?.length) {
        etfDate = etf.dates.at(-1);
        const i = etf.dates.length - 1;
        flowSum = Object.values(etf.series).reduce((s, x) => s + (x.flow?.[i] ?? 0), 0);
      }
      const trig = bottom?.triggered_count ?? 0;
      const total = bottom?.total ?? 12;
      const feedItems = feed?.items || [];
      const [label, cls] = band(trig);

      const big = document.getElementById("heroBig");
      big.textContent = bottom ? `${trig}/${total}` : "—";
      big.className = "big " + cls;
      document.getElementById("heroLbl").textContent = label;
      document.getElementById("heroLadder").innerHTML = Array.from({ length: total }, (_, i) => {
        const on = i < trig;
        const soft = on && trig < 10 && trig >= 6;
        return `<i class="${on ? (soft ? "soft" : "on") : ""}">${i + 1}</i>`;
      }).join("");

      const topNews = [...feedItems]
        .sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)))
        .slice(0, 5);
      document.getElementById("headlines").innerHTML = topNews.length
        ? topNews.map((x) => `<a href="${x.url || "feed/"}" ${x.url && x.url !== "#" ? 'target="_blank" rel="noopener"' : ""}>
            <span class="chip src">${SRC[x.source] || x.source}</span>
            <span class="t">${x.title}<em>${x.sourceName || ""} · ${DashFmt.time(x.publishedAt)}</em></span>
          </a>`).join("")
        : `<div class="empty">暂无信息流</div>`;

      const bySrc = feedItems.reduce((m, x) => ((m[x.source] = (m[x.source] || 0) + 1), m), {});
      const srcHint = Object.entries(bySrc).map(([k, v]) => `${SRC[k] || k}${v}`).join(" · ") || "—";

      document.getElementById("kpis").innerHTML = `
        <div class="card"><div class="stat-label">抄底红线</div><div class="stat-value ${cls === "hot" ? "neg" : cls === "warn" ? "amb" : ""}">${trig}<span style="font-size:.9rem;color:var(--mu)"> / ${total}</span></div><div class="stat-hint">${bottom?.generated_at || "—"}</div></div>
        <div class="card"><div class="stat-label">ETF 合计净流入</div><div class="stat-value ${flowSum > 0 ? "pos" : flowSum < 0 ? "neg" : ""}">${flowSum == null ? "—" : DashFmt.signed(flowSum, 1)}<span style="font-size:.85rem;color:var(--mu)"> 亿</span></div><div class="stat-hint">交易日 ${etfDate}</div></div>
        <div class="card"><div class="stat-label">信息流条数</div><div class="stat-value blu">${feedItems.length}</div><div class="stat-hint">${feed?.updated || "—"}</div></div>
        <div class="card"><div class="stat-label">汇金系观察份额</div><div class="stat-value">${etf?.baseline?.holders ? DashFmt.num(etf.baseline.holders.reduce((s, h) => s + (h.shares_yi || 0), 0), 0) : "—"}<span style="font-size:.85rem;color:var(--mu)"> 亿份</span></div><div class="stat-hint">${etf?.baseline?.asof || "基线"}</div></div>`;

      const watching = (bottom?.indicators || []).filter((x) => x.status === "watching").length;
      document.getElementById("modules").innerHTML = [
        moduleCard({
          href: "bottom/",
          title: "抄底红线",
          badge: `<span class="chip ${trig >= 6 ? "triggered" : "watching"}">${trig} 根触发</span>`,
          stats: `<div class="bar"><i style="width:${total ? (trig / total) * 100 : 0}%"></i></div>
            <div class="mu" style="font-size:.78rem">观察中 ${watching} · ${label}</div>`,
          desc: "12 条红线面板，统一深色皮肤",
        }),
        moduleCard({
          href: "etf/",
          title: "ETF 追踪",
          badge: etf ? `<span class="chip ok">16 只宽基</span>` : `<span class="chip watching">缺数据</span>`,
          stats: `<div class="mu mono" style="font-size:.85rem">更新 ${etf?.updated || "—"}</div>
            <div class="mu" style="font-size:.78rem">最新日合计流 ${flowSum == null ? "—" : DashFmt.signed(flowSum, 1) + " 亿"}</div>`,
          desc: "份额 / 净流入 / 期货净空 / 国家队基线",
        }),
        moduleCard({
          href: "feed/",
          title: "信息聚合",
          badge: `<span class="chip ok">${feedItems.length} 条</span>`,
          stats: `<div class="mu" style="font-size:.78rem">${srcHint}</div>`,
          desc: "公众号 · X · 星球 · 播客 · 飞书",
        }),
      ].join("");
    })();
  </script>
</body>
</html>
