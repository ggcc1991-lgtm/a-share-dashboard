<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据监控中心</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1>数据<span>监控</span>中心</h1>
      </div>
      <nav class="nav">
        <a href="./" data-match="/" class="active">总览</a>
        <a href="etf/" data-match="/etf">ETF 追踪</a>
        <a href="feed/" data-match="/feed">信息聚合</a>
        <a href="bottom/" data-match="/bottom">抄底红线</a>
      </nav>
      <div class="header-meta" id="clock"></div>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">今日总览</h2>
    <p class="page-sub">统一深色仪表盘 · ETF / 信息流 / 抄底红线</p>

    <div class="grid grid-4" id="kpis" style="margin-bottom:14px"></div>
    <div class="grid grid-3" id="modules"></div>
  </main>

  <footer class="app-footer">仅供学习研究，不构成投资建议 · 第一版壳子</footer>
  <script src="assets/shell.js"></script>
  <script>
    document.getElementById("clock").textContent =
      new Date().toLocaleString("zh-CN", { hour12: false, timeZone: "Asia/Shanghai" }) + " 北京时间";

    async function loadJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    }

    function moduleCard({ href, title, badge, stats, desc }) {
      return `<a class="card module-link" href="${href}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <strong style="font-size:1.05rem">${title}</strong>
          ${badge || ""}
        </div>
        <div style="margin-top:10px;display:grid;gap:6px">${stats}</div>
        <p class="mu" style="margin:10px 0 0;font-size:.8rem">${desc}</p>
        <div class="go">进入模块 →</div>
      </a>`;
    }

    (async () => {
      let etf = null, bottom = null, feed = null;
      try { etf = await loadJSON("data/etf.json"); } catch (e) {}
      try { bottom = await loadJSON("data/bottom.json"); } catch (e) {}
      try { feed = await loadJSON("data/feed.json"); } catch (e) {}

      let flowSum = null, etfDate = "—";
      if (etf?.series && etf?.dates?.length) {
        etfDate = etf.dates[etf.dates.length - 1];
        const i = etf.dates.length - 1;
        flowSum = Object.values(etf.series).reduce((s, x) => s + (x.flow?.[i] ?? 0), 0);
      }
      const trig = bottom?.triggered_count ?? "—";
      const total = bottom?.total ?? 12;
      const feedN = feed?.items?.length ?? 0;

      document.getElementById("kpis").innerHTML = `
        <div class="card"><div class="stat-label">抄底红线</div><div class="stat-value ${trig >= 9 ? "neg" : trig >= 6 ? "amb" : ""}">${trig}<span style="font-size:.9rem;color:var(--mu)"> / ${total}</span></div><div class="stat-hint">≥10 抄底区 · ≥6 可考虑</div></div>
        <div class="card"><div class="stat-label">ETF 合计净流入</div><div class="stat-value ${flowSum != null && flowSum < 0 ? "neg" : ""}">${flowSum == null ? "—" : DashFmt.signed(flowSum, 1)}<span style="font-size:.85rem;color:var(--mu)"> 亿</span></div><div class="stat-hint">最新交易日 ${etfDate}</div></div>
        <div class="card"><div class="stat-label">信息流增量</div><div class="stat-value blu">${feedN}</div><div class="stat-hint">${feed?.updated || "待接入正式 JSON"}</div></div>
        <div class="card"><div class="stat-label">模块</div><div class="stat-value">3</div><div class="stat-hint">同一主题 CSS</div></div>`;

      const etfBadge = etf ? `<span class="chip ok">已接 data.json</span>` : `<span class="chip watching">缺数据</span>`;
      const bottomBadge = bottom ? `<span class="chip ${trig >= 6 ? "triggered" : "watching"}">${trig} 根触发</span>` : `<span class="chip watching">缺数据</span>`;
      const feedBadge = feed?.items?.some(x => x.url === "#") ? `<span class="chip watching">占位样例</span>` : `<span class="chip ok">已接</span>`;

      document.getElementById("modules").innerHTML = [
        moduleCard({
          href: "bottom/",
          title: "抄底红线",
          badge: bottomBadge,
          stats: `<div class="stat-label">触发进度</div><div class="bar"><i style="width:${bottom ? (trig / total) * 100 : 0}%"></i></div>`,
          desc: "12 条红线面板，深色仪表盘视觉源",
        }),
        moduleCard({
          href: "etf/",
          title: "ETF 追踪",
          badge: etfBadge,
          stats: `<div class="mu mono" style="font-size:.85rem">更新：${etf?.updated || "—"}</div>`,
          desc: "国家队宽基份额 / 净流入 / 期货净空",
        }),
        moduleCard({
          href: "feed/",
          title: "信息聚合",
          badge: feedBadge,
          stats: `<div class="mu" style="font-size:.85rem">公众号 · X · 星球 · 播客</div>`,
          desc: "今日增量列表，字段已按约定对齐",
        }),
      ].join("");
    })();
  </script>
</body>
</html>
