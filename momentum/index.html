<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>动量排名 · GC的数据监控中心</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    .page-title .title-note{font-weight:500;font-size:.72em;color:var(--mu);margin-left:.15em}
    .mom-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font:11px/1.4 var(--mono);color:var(--mu-2);margin:0 0 12px}
    .mom-meta b{color:var(--tx);font-weight:600}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
    .filters label{font-size:12px;color:var(--mu);display:inline-flex;align-items:center;gap:4px}
    .filters select,.filters input[type=search]{
      font:12px/1.3 var(--sans);color:var(--tx);background:#000;border:1px solid var(--bd);
      border-radius:0;padding:5px 8px;min-width:0
    }
    .filters input[type=search]{flex:1 1 160px;max-width:280px}
    .filters select:focus,.filters input:focus{outline:1px solid var(--bb)}
    .sec-hd{margin:0 0 8px;font-size:13px;color:var(--bb);letter-spacing:.04em}
    .sec-note{font-size:11px;color:var(--mu-2);margin:0 0 10px}
    .tw{overflow:auto;-webkit-overflow-scrolling:touch;max-height:min(70vh,720px);overscroll-behavior:contain}
    /* 列表跟页滚，避免手机嵌套滚动卡住 */
    .list-wrap .tw{max-height:none;overflow:visible;overscroll-behavior:auto;-webkit-overflow-scrolling:auto}
    .scroll-hint{display:none;font:10px/1.3 var(--mono);color:var(--mu-3);margin:0 0 6px}
    /* heat grid — original P1–P10 palette */
    table.heat{
      width:100%;border-collapse:separate;border-spacing:0;
      font:12px/1.3 var(--mono);font-variant-numeric:tabular-nums;min-width:720px
    }
    table.heat th,table.heat td{
      border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);
      padding:0;vertical-align:middle;background:#0a0a0a
    }
    table.heat thead th{
      position:sticky;top:0;z-index:3;background:#111;color:var(--mu-2);
      font-size:10px;font-weight:800;letter-spacing:.04em;padding:6px 4px;text-align:center
    }
    table.heat th.l,table.heat td.l{text-align:left;padding:6px 8px;position:sticky;left:0;z-index:2;background:#0e0e0e;min-width:7em;max-width:11em}
    table.heat th.code,table.heat td.code{text-align:left;padding:6px 6px;position:sticky;left:7em;z-index:2;background:#0e0e0e;color:var(--mu);min-width:4.5em}
    table.heat thead th.l,table.heat thead th.code{z-index:4;background:#111}
    table.heat .nm{display:flex;align-items:center;gap:6px;min-width:0}
    table.heat .rk{color:var(--mu-2);flex:0 0 auto}
    table.heat .name{color:var(--tx);font-family:var(--sans);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    table.heat .code-sub{display:none}
    table.heat .cell{
      min-width:48px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1px;font-weight:700;line-height:1;border:1px solid rgba(0,0,0,.25)
    }
    table.heat .cell .r{font-size:11px}
    table.heat .cell .v{font-size:9px;opacity:.85}
    /* ranking list */
    table.data th,table.data td{text-align:right}
    table.data th.l,table.data td.l,table.data th:first-child,table.data td:first-child{text-align:left}
    table.data th.c,table.data td.c{text-align:center}
    table.data .rk{color:var(--bb);font-weight:700}
    table.data .code{color:var(--mu)}
    table.data .name{color:var(--tx);font-family:var(--sans);font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis}
    table.data .grp{color:var(--mu-2);font-family:var(--sans);font-size:11px}
    table.data .up{color:var(--pos)}
    table.data .dn{color:var(--neg)}
    .tier-chip{
      display:inline-block;min-width:2.6em;padding:2px 6px;font:700 10px/1.35 var(--mono);
      letter-spacing:.04em;text-align:center;border:1px solid transparent
    }
    .list-x{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;overscroll-behavior-y:auto}
    .list-wrap{margin-top:18px}
    @media (max-width:719px){
      html,body{overflow-x:hidden}
      main.wrap{overflow-x:hidden;max-width:100%}
      .panel{max-width:100%}
      #heatBox.panel{overflow:hidden}
      #heatBox > .tw{overflow-x:auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
      .list-wrap.panel{overflow:visible}
      .list-wrap .tw{max-height:none!important;overflow:visible!important;overscroll-behavior:auto}
      .page-title{font-size:1.05rem;line-height:1.35}
      .page-title .title-note{display:block;margin:.15em 0 0;font-size:.68em}
      .page-sub{font-size:12px;line-height:1.45}
      .mom-meta{gap:6px 10px;font-size:10px;margin-bottom:10px}
      .filters{gap:6px;margin-bottom:10px}
      .filters label{flex:1 1 calc(50% - 6px);min-width:0;justify-content:space-between}
      .filters label select{flex:1 1 auto;max-width:100%}
      .filters input[type=search]{flex:1 1 100%;max-width:none;width:100%}
      .sec-hd{font-size:12px}
      .sec-note{font-size:10px;line-height:1.4}
      .scroll-hint{display:block}
      #heatBox > .tw{max-height:min(48vh,420px);margin:0 -2px;padding-bottom:2px}
      /* heat: drop code col, tighter sticky name, smaller cells */
      table.heat{min-width:0;width:max-content}
      table.heat th.code,table.heat td.code{display:none}
      table.heat th.l,table.heat td.l{
        min-width:7.5em;max-width:9em;width:8.5em;padding:5px 8px;
        box-shadow:2px 0 0 rgba(255,255,255,.06)
      }
      table.heat thead th{font-size:9px;padding:5px 2px}
      table.heat .rk{display:none}
      table.heat .nm{flex-direction:column;align-items:flex-start;gap:1px}
      table.heat .name{
        font-size:12px;font-weight:650;white-space:normal;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
        overflow:hidden;max-width:100%;line-height:1.25
      }
      table.heat .code-sub{display:block;font:10px/1.2 var(--mono);color:var(--mu-2)}
      table.heat .cell{min-width:34px;width:34px;height:30px}
      table.heat .cell .r{font-size:10px}
      table.heat .cell .v{display:none} /* rank only on phone */
      /* list: hide 分组, denser */
      table.data{font-size:11px}
      table.data th,table.data td{padding:5px 6px}
      table.data th:nth-child(4),table.data td:nth-child(4){display:none} /* 分组 */
      table.data .name{max-width:5.5em}
      .list-x{max-width:100%;overflow-x:auto;overflow-y:visible}
      .list-wrap{margin-top:14px}
    }
    @media (max-width:379px){
      table.heat th.l,table.heat td.l{min-width:6.8em;max-width:8em;width:7.5em;padding:4px 6px}
      table.heat .cell{min-width:30px;width:30px;height:28px}
      table.heat .cell .r{font-size:9px}
      table.heat .name{font-size:11px}
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand"><div class="brand-mark"></div><h1>GC的数据<span>监控</span>中心</h1></div>
      <nav class="nav">
        <a href="../" data-match="/">总览</a>
        <div class="nav-dd" data-match="/etf">
          <button type="button" class="nav-dd-btn active" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dd-etf">ETF<span class="nav-dd-caret" aria-hidden="true">▾</span></button>
          <div class="nav-dd-panel" id="nav-dd-etf" role="menu" aria-label="ETF">
            <a href="../etf/" role="menuitem">国家队追踪</a>
            <a href="../sentiment/" role="menuitem">情绪看板</a>
            <a href="../momentum/" role="menuitem">动量排名</a>
          </div>
        </div>
        <a href="../feed/" data-match="/feed">信息流</a>
        <a href="../bottom/" data-match="/bottom">抄底信号</a>
        <a href="../policy/" data-match="/policy">政策产业</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">动量排名<span class="title-note" id="metricNote">（20日斜率动量）</span></h2>
    <p class="page-sub" id="sum">加载 data/momentum.json …</p>
    <div class="mom-meta" id="meta" hidden></div>

    <div class="filters">
      <label>分组
        <select id="groupSel"><option value="">全部</option></select>
      </label>
      <label>分位
        <select id="tierSel"><option value="">全部</option></select>
      </label>
      <input type="search" id="q" placeholder="代码 / 名称" autocomplete="off" />
    </div>


    <!-- 表格（热力）在上 -->
    <div class="panel" id="heatBox" hidden>
      <h2 class="sec-hd">近 10 日动量热力</h2>
      <p class="sec-note">色块按原版 P1–P10 分位（绿弱→红强）；格内为当日排名与动量。</p>
      <p class="scroll-hint">← 左右滑动查看近 10 日 · 左侧名称固定</p>
      <div class="tw heat-tw" id="heatScroll">
        <table class="heat" id="heatTbl">
          <thead id="heatHead"></thead>
          <tbody id="heatBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 列表在下 -->
    <div class="panel list-wrap">
      <h2 class="sec-hd">当日排名列表</h2>
      <p class="scroll-hint">窄屏已隐藏「分组」列；可左右滑动看收盘/动量</p>
      <div class="list-x">
        <table class="data" id="tbl">
          <thead>
            <tr>
              <th class="c">#</th>
              <th class="l">代码</th>
              <th class="l">名称</th>
              <th class="l">分组</th>
              <th>收盘</th>
              <th>动量</th>
              <th class="c">分位</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../assets/shell.js"></script>
  <script>
(function () {
  const $ = (id) => document.getElementById(id);

  // 原版 P1–P10：绿=最弱 → 红=最强
  const TIER_ORDER = ["P1","P2","P3","P4","P5","P6","P7","P8","P9","P10"];
  const TIER_STYLE = {
    P1: { bg: "#2e7d32", text: "#ffffff" },
    P2: { bg: "#4caf50", text: "#ffffff" },
    P3: { bg: "#8bc34a", text: "#ffffff" },
    P4: { bg: "#cddc39", text: "#1f2937" },
    P5: { bg: "#ffeb3b", text: "#1f2937" },
    P6: { bg: "#ffc107", text: "#1f2937" },
    P7: { bg: "#ff9800", text: "#1f2937" },
    P8: { bg: "#f57c00", text: "#ffffff" },
    P9: { bg: "#f4511e", text: "#ffffff" },
    P10:{ bg: "#e53935", text: "#ffffff" },
  };

  let DATA = null;
  let rows = [];
  let byHeat = {};

  function fmtNum(v, d) {
    if (v == null || Number.isNaN(+v)) return "—";
    return (+v).toLocaleString("zh-CN", { maximumFractionDigits: d, minimumFractionDigits: d });
  }
  function fmtMom(v, d) {
    if (v == null || Number.isNaN(+v)) return "—";
    const n = +v;
    const s = n > 0 ? "+" : "";
    return s + n.toLocaleString("zh-CN", { maximumFractionDigits: d, minimumFractionDigits: Math.min(1, d) });
  }
  function momClass(v) {
    if (v == null || Number.isNaN(+v) || +v === 0) return "";
    return +v > 0 ? "up" : "dn";
  }
  function tierFromRank(rank, pool) {
    if (rank == null || !pool) return null;
    const step = pool / 10;
    const p = 11 - Math.min(10, Math.max(1, Math.ceil(rank / step)));
    return "P" + p;
  }
  function tierStyle(tier) {
    return tier && TIER_STYLE[tier] ? TIER_STYLE[tier] : null;
  }

  function fillFilters(list) {
    const groups = [...new Set(list.map((x) => x.group).filter(Boolean))].sort();
    const tiers = [...new Set(list.map((x) => x.tier).filter(Boolean))].sort((a, b) => {
      return (+String(b).replace(/\D/g, "") || 0) - (+String(a).replace(/\D/g, "") || 0);
    });
    const gs = $("groupSel"), ts = $("tierSel");
    groups.forEach((g) => { const o = document.createElement("option"); o.value = g; o.textContent = g; gs.appendChild(o); });
    tiers.forEach((t) => { const o = document.createElement("option"); o.value = t; o.textContent = t; ts.appendChild(o); });
  }

  function filtered() {
    const g = $("groupSel").value;
    const t = $("tierSel").value;
    const q = ($("q").value || "").trim().toLowerCase();
    return rows.filter((x) => {
      if (g && x.group !== g) return false;
      if (t && x.tier !== t) return false;
      if (q) {
        const hay = `${x.code || ""} ${x.name || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }


  function renderList() {
    const list = filtered();
    $("tbody").innerHTML = list.map((x) => {
      const st = tierStyle(x.tier);
      const chip = st
        ? `<span class="tier-chip" style="background:${st.bg};color:${st.text}">${x.tier}</span>`
        : `<span class="tier-chip">${x.tier || "—"}</span>`;
      return `<tr>
        <td class="c rk">${x.rank ?? "—"}</td>
        <td class="l code">${x.code || "—"}</td>
        <td class="l name" title="${x.name || ""}">${x.name || "—"}</td>
        <td class="l grp">${x.group || "—"}</td>
        <td>${fmtNum(x.close, 3)}</td>
        <td class="${momClass(x.momentum)}">${fmtMom(x.momentum, 4)}</td>
        <td class="c">${chip}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="7" class="l" style="color:var(--mu)">无匹配结果</td></tr>`;
  }

  function renderHeat() {
    const datesAsc = DATA.recentDates || [];
    if (!datesAsc.length) return;
    const dates = datesAsc.slice().reverse(); // 原版：最近日在左
    const pool = DATA.poolSize || rows.length || 50;
    const list = filtered();

    $("heatHead").innerHTML = `<tr>
      <th class="l">名称</th>
      <th class="code">代码</th>
      ${dates.map((d) => `<th>${String(d).slice(5)}</th>`).join("")}
    </tr>`;

    $("heatBody").innerHTML = list.map((r) => {
      const series = (byHeat[r.code] && byHeat[r.code].series) || [];
      const byDate = Object.fromEntries(series.map((s) => [s.date, s]));
      const cells = dates.map((d) => {
        const s = byDate[d];
        if (!s || s.rank == null) {
          return `<td><div class="cell" style="background:#1a1a1a;color:var(--mu-3)">—</div></td>`;
        }
        const tier = tierFromRank(s.rank, pool);
        const st = tierStyle(tier) || { bg: "#333", text: "#fff" };
        const tip = `${r.name} · ${d} · ${tier} · 排名 ${s.rank}/${pool} · 动量 ${fmtMom(s.momentum, 4)}`;
        return `<td><div class="cell" style="background:${st.bg};color:${st.text}" title="${tip}">
          <span class="r">${s.rank}</span>
          <span class="v">${fmtMom(s.momentum, 1)}</span>
        </div></td>`;
      }).join("");
      return `<tr>
        <td class="l"><div class="nm"><span class="rk">${r.rank ?? ""}.</span><span class="name" title="${(r.name || "") + " " + (r.code || "")}">${r.name || "—"}</span><span class="code-sub">${r.code || ""}</span></div></td>
        <td class="code">${r.code || "—"}</td>
        ${cells}
      </tr>`;
    }).join("") || `<tr><td class="l" colspan="${2 + dates.length}" style="padding:10px;color:var(--mu)">无匹配结果</td></tr>`;

    $("heatBox").hidden = false;
  }

  function renderAll() {
    renderHeat();
    renderList();
  }

  function bind() {
    ["groupSel", "tierSel", "q"].forEach((id) => {
      $(id).addEventListener("input", renderAll);
      $(id).addEventListener("change", renderAll);
    });
  }

  fetch("data/momentum.json", { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then((d) => {
      DATA = d;
      rows = Array.isArray(d.ranking) ? d.ranking.slice() : [];
      rows.sort((a, b) => (a.rank || 999) - (b.rank || 999));
      byHeat = Object.fromEntries((d.heat || []).map((h) => [h.code, h]));
      $("metricNote").textContent = `（${d.metric || "20日斜率动量"}）`;
      $("sum").textContent = `交易日 ${d.tradeDate || "—"} · 池 ${d.poolSize || rows.length} · 更新 ${d.updatedAt || "—"}`;
      const rf = d.refresh || {};
      $("meta").hidden = false;
      $("meta").innerHTML = `
        <span>节奏 <b>${rf.cadence || "每个交易日盘后 1 次"}</b></span>
        <span>窗口 <b>${rf.targetTime || "约 16:30–23:00"}</b></span>
        <span>说明 <b>${rf.note || "无新交易日可不重推"}</b></span>`;
      fillFilters(rows);
      bind();
      renderAll();
    })
    .catch((e) => {
      $("sum").textContent = "加载失败：" + (e && e.message ? e.message : e);
    });
})();
  </script>
</body>
</html>
