<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抄底信号 · GC的数据监控中心</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    .hero { margin-bottom: 14px; }
    .ind-full .bb-ind-hd,
    .ind-full .bb-ind-row {
      grid-template-columns: 14px minmax(96px, 1.1fr) 88px minmax(100px, 1.2fr) 40px minmax(120px, 1.6fr);
    }
    .ind-full .bb-ind-row .thr,
    .ind-full .bb-ind-row .note {
      font-size: 11px;
      color: var(--mu-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ind-full .bb-ind-row .note { color: #787878; }
    .ind-full .bb-ind-row.is-on .note { color: #a0a0a0; }
    .near-row, .chg-row, .adv-li {
      display: grid; gap: 6px; align-items: baseline;
      padding: 5px 10px; border-bottom: 1px solid #141414; font-size: 12px;
    }
    .near-row { grid-template-columns: 1fr 120px 1.4fr; }
    .chg-row { grid-template-columns: 1fr 72px 72px 56px; }
    .near-row:last-child, .chg-row:last-child { border-bottom: 0; }
    .sec-box { border: var(--hair); background: var(--surface); margin-bottom: 14px; }
    .sec-hd {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #666;
      border-bottom: 1px solid #333; padding: 5px 10px; background: #050505;
    }
    .verdict-body {
      padding: 10px 12px; font-size: 12px; color: #c8c8c8; line-height: 1.55;
      border-bottom: 1px solid #1a1a1a;
    }
    .adv-block { padding: 0; }
    .adv-block h4 {
      margin: 0; padding: 6px 10px 2px; font-size: 11px; color: var(--bb);
      letter-spacing: .04em; font-weight: 700;
    }
    .adv-li { display: block; padding: 4px 10px 4px 18px; color: #b8b8b8; position: relative; }
    .adv-li::before { content: "·"; position: absolute; left: 10px; color: var(--bb); }
    .strat { padding: 8px 10px; font-size: 11px; color: var(--mu); border-top: 1px solid #1a1a1a; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) {
      .two { grid-template-columns: 1fr; }
      .ind-full .bb-ind-hd, .ind-full .bb-ind-row {
        grid-template-columns: 14px 1fr 72px 40px;
      }
      .ind-full .bb-ind-hd .thr,
      .ind-full .bb-ind-hd .note,
      .ind-full .bb-ind-row .thr,
      .ind-full .bb-ind-row .note { display: none; }
    }
    .delta-neg { color: var(--neg); }
    .delta-pos { color: var(--pos); }
    .flip-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand"><div class="brand-mark"></div><h1>GC的数据<span>监控</span>中心</h1></div>
      <nav class="nav">
        <a href="../" data-match="/">总览</a>
        <a href="../etf/" data-match="/etf">ETF</a>
        <a href="../feed/" data-match="/feed">信息流</a>
        <a href="./" data-match="/bottom" class="active">抄底信号</a>
        <a href="../policy/" data-match="/policy">政策产业</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h2 class="page-title">抄底信号</h2>
    <p class="page-sub">由GC制作</p>
    <p class="page-sub mono" id="meta" style="margin-top:-8px">加载 data/bottom.json …</p>

    <div class="bb-ind hero" id="hero">加载中…</div>

    <div class="bb-sec"><h2>十二指标</h2></div>
    <div class="bb-ind ind-full" id="inds"></div>

    <div class="two">
      <div>
        <div class="bb-sec"><h2>距红线最近</h2></div>
        <div class="sec-box" id="nearest"></div>
      </div>
      <div>
        <div class="bb-sec"><h2>较上次</h2></div>
        <div class="sec-box" id="changes"></div>
      </div>
    </div>

    <div class="bb-sec"><h2>整体判断</h2></div>
    <div class="sec-box" id="verdict"></div>
  </main>
  <footer class="app-footer" id="foot">仅供学习研究，不构成投资建议</footer>
  <script src="../assets/shell.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmtVal(x) {
      if (x == null || x === "") return "—";
      if (typeof x === "number") {
        if (window.DashFmt && DashFmt.num) return DashFmt.num(x, 2);
        return Number.isInteger(x) ? String(x) : x.toFixed(2);
      }
      return String(x);
    }
    function fmtThr(t) {
      if (t == null || t === "") return "—";
      return String(t);
    }
    function shortNote(n, lim) {
      const s = String(n || "").replace(/\s+/g, " ").trim();
      if (!s) return "—";
      return s.length > (lim || 72) ? s.slice(0, lim || 72) + "…" : s;
    }
    function bandCls(n) {
      if (n >= 10) return "hot";
      if (n >= 6) return "warn";
      return "";
    }
    function fmtTime(v) {
      if (!v) return "—";
      if (window.DashFmt && DashFmt.time) return DashFmt.time(v);
      return String(v).replace("T", " ").slice(0, 16);
    }

    fetch("../data/bottom.json")
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(d => {
        const trig = d.triggered_count ?? d.verdict?.score ?? 0;
        const total = d.total ?? d.verdict?.total ?? 12;
        const band = d.verdict?.band || {};
        const label = band.label || "—";
        const sub = band.rule || band.sub || "";
        const hot = bandCls(trig);
        const inds = d.indicators || [];
        const watchN = inds.filter(x => x.status === "watching").length;

        document.getElementById("meta").textContent =
          `asOf ${fmtTime(d.generated_at || d.verdict?.generated_at)} · ${d.timezone || "Asia/Shanghai"} · 红线 ${trig}/${total}`;

        const ticks = Array.from({ length: total }, (_, i) => {
          const on = i < trig;
          return `<i class="${on ? (trig >= 10 ? "on" : "soft") : ""}"></i>`;
        }).join("");

        document.getElementById("hero").innerHTML = `
          <div class="bb-ind-top">
            <div class="ratio ${hot}">${trig}<span style="font-size:13px;color:#666">/${total}</span></div>
            <div class="bb-ind-top-main">
              <div class="band">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>
              <div class="ticks">${ticks}</div>
            </div>
          </div>
          <div class="bb-ind-foot">
            <span>触发 ${trig} · 观察 ${watchN}</span>
            <span class="mono">${esc(fmtTime(d.generated_at))}</span>
          </div>`;

        const rows = inds.map(x => {
          const on = x.status === "triggered";
          const unit = x.unit ? ` ${x.unit}` : "";
          return `<div class="bb-ind-row ${on ? "is-on" : ""}" title="${esc(x.note || "")}">
            <span class="dot"></span>
            <span class="nm">${esc(x.name || "—")}</span>
            <span class="val">${esc(fmtVal(x.value))}${esc(unit)}</span>
            <span class="thr" title="${esc(fmtThr(x.threshold))}">${esc(fmtThr(x.threshold))}</span>
            <span class="st">${on ? "红线" : "观察"}</span>
            <span class="note" title="${esc(x.note || "")}">${esc(shortNote(x.note, 80))}</span>
          </div>`;
        }).join("");

        document.getElementById("inds").innerHTML = `
          <div class="bb-ind-hd">
            <span>#</span><span>INDICATOR</span><span style="text-align:right">VALUE</span>
            <span>THRESHOLD</span><span style="text-align:right">状态</span><span>NOTE</span>
          </div>
          ${rows || `<div class="mu" style="padding:8px 10px">暂无指标</div>`}`;

        const nearest = d.verdict?.nearest || [];
        document.getElementById("nearest").innerHTML =
          `<div class="sec-hd">NEAREST · ${nearest.length}</div>` +
          (nearest.map(x => `
            <div class="near-row">
              <span class="nm" style="font-weight:600;color:#e8e8e8">${esc(x.name || "—")}</span>
              <span class="mono" style="color:var(--bb);text-align:right">${x.dist_pct == null ? "—" : esc(x.dist_pct) + "%"}</span>
              <span class="mu" style="font-size:11px">${esc(x.dist_text || "")}</span>
            </div>`).join("") || `<div class="mu" style="padding:8px 10px">暂无</div>`);

        const ch = d.verdict?.changes || {};
        const flips = ch.flipped || [];
        const moves = (ch.moves || []).slice(0, 8);
        let chHtml = `<div class="sec-hd">CHANGES</div>`;
        chHtml += `<div class="verdict-body" style="padding:8px 10px;border-bottom:1px solid #1a1a1a">
          <div style="color:#e8e8e8;font-weight:600">${esc(ch.text || `红线 ${ch.score_prev ?? "—"} → ${trig}`)}</div>
          <div class="mu mono" style="font-size:11px;margin-top:4px">prev ${esc(fmtTime(ch.prev_at))} · Δ ${ch.score_delta == null ? "—" : (ch.score_delta > 0 ? "+" : "") + ch.score_delta}</div>
        </div>`;
        if (flips.length) {
          chHtml += flips.map(f => `
            <div class="chg-row">
              <span style="font-weight:600">${esc(f.name)}</span>
              <span class="mu">${esc(f.from)}</span>
              <span>→ ${esc(f.to)}</span>
              <span class="flip-tag ${f.dir === "down" ? "delta-neg" : "delta-pos"}">${esc(f.dir || "")}</span>
            </div>`).join("");
        }
        if (moves.length) {
          chHtml += `<div class="sec-hd" style="border-top:1px solid #222">MOVES</div>` +
            moves.map(m => {
              const dlt = m.delta;
              const cls = dlt > 0 ? "delta-pos" : dlt < 0 ? "delta-neg" : "";
              return `<div class="chg-row">
                <span>${esc(m.name)}</span>
                <span class="mono mu">${esc(fmtVal(m.prev))}</span>
                <span class="mono">${esc(fmtVal(m.now))}</span>
                <span class="mono ${cls}">${dlt == null ? "—" : (dlt > 0 ? "+" : "") + esc(fmtVal(dlt))}</span>
              </div>`;
            }).join("");
        }
        document.getElementById("changes").innerHTML = chHtml;

        const v = d.verdict || {};
        const adv = v.advice || {};
        const empty = adv.empty || [];
        const holding = adv.holding || [];
        const strat = d.strategy?.summary || "";
        document.getElementById("verdict").innerHTML = `
          <div class="verdict-body">${esc(v.summary || "—")}</div>
          <div class="adv-block">
            <h4>空仓</h4>
            ${empty.map(t => `<div class="adv-li">${esc(t)}</div>`).join("") || `<div class="mu" style="padding:6px 10px">—</div>`}
            <h4>持仓</h4>
            ${holding.map(t => `<div class="adv-li">${esc(t)}</div>`).join("") || `<div class="mu" style="padding:6px 10px">—</div>`}
          </div>
          ${strat ? `<div class="strat">${esc(strat)}</div>` : ""}`;

        document.getElementById("foot").textContent =
          d.disclaimer || "仅供学习研究，不构成投资建议；市场有风险";
      })
      .catch(e => {
        document.getElementById("meta").textContent = "无法加载 bottom.json：" + e.message;
        document.getElementById("hero").textContent = "加载失败";
      });
  </script>
</body>
</html>
