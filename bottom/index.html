<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抄底信号 · GC的数据监控中心</title>
  <link rel="stylesheet" href="../assets/theme.css" />
  <script src="../assets/echarts.min.js"></script>
  <style>
    .hero { margin-bottom: 14px; }
    .ind-full .bb-ind-hd,
    .ind-full .bb-ind-row {
      grid-template-columns: 14px minmax(96px, 1.1fr) 88px minmax(100px, 1.2fr) 40px minmax(120px, 1.6fr);
    }
    .ind-full .bb-ind-row .thr,
    .ind-full .bb-ind-row .note {
      font-size: 11px;
      color: var(--mu-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ind-full .bb-ind-row .note { color: #787878; }
    .ind-full .bb-ind-row.is-on .note { color: #a0a0a0; }
    .near-row, .chg-row, .adv-li {
      display: grid; gap: 6px; align-items: baseline;
      padding: 5px 10px; border-bottom: 1px solid #141414; font-size: 12px;
    }
    .near-row { grid-template-columns: 1fr 120px 1.4fr; }
    .chg-row { grid-template-columns: 1fr 72px 72px 56px; }
    .near-row:last-child, .chg-row:last-child { border-bottom: 0; }
    .sec-box { border: var(--hair); background: var(--surface); margin-bottom: 14px; }
    .sec-hd {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #666;
      border-bottom: 1px solid #333; padding: 5px 10px; background: #050505;
    }
    .verdict-body {
      padding: 10px 12px; font-size: 12px; color: #c8c8c8; line-height: 1.55;
      border-bottom: 1px solid #1a1a1a;
    }
    .adv-block { padding: 0; }
    .adv-block h4 {
      margin: 0; padding: 6px 10px 2px; font-size: 11px; color: var(--bb);
      letter-spacing: .04em; font-weight: 700;
    }
    .adv-li { display: block; padding: 4px 10px 4px 18px; color: #b8b8b8; position: relative; }
    .adv-li::before { content: "·"; position: absolute; left: 10px; color: var(--bb); }
    .strat { padding: 8px 10px; font-size: 11px; color: var(--mu); border-top: 1px solid #1a1a1a; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) {
      .two { grid-template-columns: 1fr; }
      .ind-full .bb-ind-hd, .ind-full .bb-ind-row {
        grid-template-columns: 14px 1fr 72px 40px;
      }
      .ind-full .bb-ind-hd .thr,
      .ind-full .bb-ind-hd .note,
      .ind-full .bb-ind-row .thr,
      .ind-full .bb-ind-row .note { display: none; }
    }
    .delta-neg { color: var(--neg); }
    .delta-pos { color: var(--pos); }
    .flip-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; }

    .charts {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 0;
      border: var(--hair);
      background: var(--surface);
      margin-bottom: 14px;
    }
    .charts .cbox {
      border-right: var(--hair);
      min-height: 220px;
      padding: 4px 0 0;
    }
    .charts .cbox:last-child { border-right: 0; }
    .charts .cbox h3 {
      margin: 0; padding: 6px 10px 0;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: #666; font-weight: 700;
    }
    .charts .chart { height: 200px; width: 100%; }
    @media (max-width: 900px) {
      .charts { grid-template-columns: 1fr; }
      .charts .cbox { border-right: 0; border-bottom: var(--hair); }
      .charts .cbox:last-child { border-bottom: 0; }
    }

    .charts-hist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: var(--hair);
      background: var(--surface);
      margin-bottom: 14px;
    }
    .charts-hist .cbox {
      border-right: var(--hair);
      border-bottom: var(--hair);
      min-height: 240px;
      padding: 4px 0 0;
    }
    .charts-hist .cbox-kline {
      grid-column: 1 / -1;
      border-right: 0;
    }
    .charts-hist .cbox:nth-child(2) { border-bottom: 0; }
    .charts-hist .cbox:last-child { border-right: 0; border-bottom: 0; }
    .charts-hist .cbox h3 {
      margin: 0; padding: 6px 10px 0;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: #666; font-weight: 700;
    }
    .charts-hist .chart { height: 220px; width: 100%; }
    @media (max-width: 900px) {
      .charts-hist { grid-template-columns: 1fr; }
      .charts-hist .cbox,
      .charts-hist .cbox-kline {
        grid-column: auto;
        border-right: 0;
        border-bottom: var(--hair);
      }
      .charts-hist .cbox:last-child { border-bottom: 0; }
    }
    @media (max-width: 719px) {
      .charts .cbox,
      .charts-hist .cbox { min-width: 0; }
      .charts .chart { height: 180px; }
      .charts-hist .chart { height: 200px; }
      .near-row { grid-template-columns: minmax(0,1fr) 88px minmax(0,1.2fr); }
      .chg-row { grid-template-columns: minmax(0,1fr) 56px 56px 48px; }
      .ind-full .bb-ind-hd,
      .ind-full .bb-ind-row {
        grid-template-columns: 12px minmax(0,1fr) 56px 36px;
      }
      .ind-full .bb-ind-hd > span,
      .ind-full .bb-ind-row > span { min-width: 0; }
      .ind-full .bb-ind-hd > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .04em; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand"><div class="brand-mark"></div><h1>GC的数据<span>监控</span>中心</h1></div>
      <nav class="nav">
        <a href="../" data-match="/">总览</a>
        <div class="nav-dd" data-match="/etf">
          <button type="button" class="nav-dd-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dd-etf">ETF<span class="nav-dd-caret" aria-hidden="true">▾</span></button>
          <div class="nav-dd-panel" id="nav-dd-etf" role="menu" aria-label="ETF">
            <a href="../etf/" role="menuitem">国家队追踪</a>
            <a href="../sentiment/" role="menuitem">情绪看板</a>
            <a href="../momentum/" role="menuitem">动量排名</a>
          </div>
        </div>
        <a href="../feed/" data-match="/feed">信息流</a>
        <a href="./" data-match="/bottom" class="active">抄底信号</a>
        <a href="../policy/" data-match="/policy">政策产业</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h2 class="page-title">抄底信号</h2>
    <p class="page-sub">由GC制作</p>
    <p class="page-sub mono" id="meta" style="margin-top:-8px">加载 data/bottom.json …</p>

    <div class="bb-ind hero" id="hero">加载中…</div>

    <div class="bb-sec"><h2>可视化</h2></div>
    <div class="charts">
      <div class="cbox"><h3>SCORE GAUGE</h3><div class="chart" id="chartGauge"></div></div>
      <div class="cbox"><h3>GROUPS</h3><div class="chart" id="chartGroups"></div></div>
      <div class="cbox"><h3>NEAREST PROGRESS</h3><div class="chart" id="chartNear"></div></div>
    </div>
    <div class="charts-hist" id="chartsHist" hidden>
      <div class="cbox cbox-kline"><h3>中证1000 K线</h3><div class="chart" id="chartKline"></div></div>
      <div class="cbox"><h3>IM贴水</h3><div class="chart" id="chartBasis"></div></div>
      <div class="cbox"><h3>融资余额</h3><div class="chart" id="chartMargin"></div></div>
    </div>

    <div class="bb-sec"><h2>十二指标</h2></div>
    <div class="bb-ind ind-full" id="inds"></div>

    <div class="two">
      <div>
        <div class="bb-sec"><h2>距红线最近</h2></div>
        <div class="sec-box" id="nearest"></div>
      </div>
      <div>
        <div class="bb-sec"><h2>较上次</h2></div>
        <div class="sec-box" id="changes"></div>
      </div>
    </div>

    <div class="bb-sec"><h2>整体判断</h2></div>
    <div class="sec-box" id="verdict"></div>
  </main>
  <footer class="app-footer" id="foot">仅供学习研究，不构成投资建议</footer>
  <script src="../assets/shell.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmtVal(x) {
      if (x == null || x === "") return "—";
      if (typeof x === "number") {
        if (window.DashFmt && DashFmt.num) return DashFmt.num(x, 2);
        return Number.isInteger(x) ? String(x) : x.toFixed(2);
      }
      return String(x);
    }
    function fmtThr(t) {
      if (t == null || t === "") return "—";
      return String(t);
    }
    function shortNote(n, lim) {
      const s = String(n || "").replace(/\s+/g, " ").trim();
      if (!s) return "—";
      return s.length > (lim || 72) ? s.slice(0, lim || 72) + "…" : s;
    }
    function bandCls(n) {
      if (n >= 10) return "hot";
      if (n >= 6) return "warn";
      return "";
    }
    function fmtTime(v) {
      if (!v) return "—";
      if (window.DashFmt && DashFmt.time) return DashFmt.time(v);
      return String(v).replace("T", " ").slice(0, 16);
    }

    function loadJSON(url) {
      return fetch(url).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }

    Promise.all([
      loadJSON("../data/bottom.json"),
      loadJSON("../data/history.json").catch(() => null),
    ])
      .then(([d, hist]) => {
        const trig = d.triggered_count ?? d.verdict?.score ?? 0;
        const total = d.total ?? d.verdict?.total ?? 12;
        const band = d.verdict?.band || {};
        const label = band.label || "—";
        const sub = band.rule || band.sub || "";
        const hot = bandCls(trig);
        const inds = d.indicators || [];
        const watchN = inds.filter(x => x.status === "watching").length;

        document.getElementById("meta").textContent =
          `asOf ${fmtTime(d.generated_at || d.verdict?.generated_at)} · ${d.timezone || "Asia/Shanghai"} · 红线 ${trig}/${total}`;

        const ticks = Array.from({ length: total }, (_, i) => {
          const on = i < trig;
          return `<i class="${on ? (trig >= 10 ? "on" : "soft") : ""}"></i>`;
        }).join("");

        document.getElementById("hero").innerHTML = `
          <div class="bb-ind-top">
            <div class="ratio ${hot}">${trig}<span style="font-size:13px;color:#666">/${total}</span></div>
            <div class="bb-ind-top-main">
              <div class="band">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>
              <div class="ticks">${ticks}</div>
            </div>
          </div>
          <div class="bb-ind-foot">
            <span>触发 ${trig} · 观察 ${watchN}</span>
            <span class="mono">${esc(fmtTime(d.generated_at))}</span>
          </div>`;

        const rows = inds.map(x => {
          const on = x.status === "triggered";
          const unit = x.unit ? ` ${x.unit}` : "";
          return `<div class="bb-ind-row ${on ? "is-on" : ""}" title="${esc(x.note || "")}">
            <span class="dot"></span>
            <span class="nm">${esc(x.name || "—")}</span>
            <span class="val">${esc(fmtVal(x.value))}${esc(unit)}</span>
            <span class="thr" title="${esc(fmtThr(x.threshold))}">${esc(fmtThr(x.threshold))}</span>
            <span class="st">${on ? "红线" : "观察"}</span>
            <span class="note" title="${esc(x.note || "")}">${esc(shortNote(x.note, 80))}</span>
          </div>`;
        }).join("");

        document.getElementById("inds").innerHTML = `
          <div class="bb-ind-hd">
            <span>#</span><span>INDICATOR</span><span style="text-align:right">VALUE</span>
            <span class="thr">THRESHOLD</span><span class="st" style="text-align:right">状态</span><span class="note">NOTE</span>
          </div>
          ${rows || `<div class="mu" style="padding:8px 10px">暂无指标</div>`}`;

        const nearest = d.verdict?.nearest || [];
        document.getElementById("nearest").innerHTML =
          `<div class="sec-hd">NEAREST · ${nearest.length}</div>` +
          (nearest.map(x => `
            <div class="near-row">
              <span class="nm" style="font-weight:600;color:#e8e8e8">${esc(x.name || "—")}</span>
              <span class="mono" style="color:var(--bb);text-align:right">${x.dist_pct == null ? "—" : esc(x.dist_pct) + "%"}</span>
              <span class="mu" style="font-size:11px">${esc(x.dist_text || "")}</span>
            </div>`).join("") || `<div class="mu" style="padding:8px 10px">暂无</div>`);

        const ch = d.verdict?.changes || {};
        const flips = ch.flipped || [];
        const moves = (ch.moves || []).slice(0, 8);
        let chHtml = `<div class="sec-hd">CHANGES</div>`;
        chHtml += `<div class="verdict-body" style="padding:8px 10px;border-bottom:1px solid #1a1a1a">
          <div style="color:#e8e8e8;font-weight:600">${esc(ch.text || `红线 ${ch.score_prev ?? "—"} → ${trig}`)}</div>
          <div class="mu mono" style="font-size:11px;margin-top:4px">prev ${esc(fmtTime(ch.prev_at))} · Δ ${ch.score_delta == null ? "—" : (ch.score_delta > 0 ? "+" : "") + ch.score_delta}</div>
        </div>`;
        if (flips.length) {
          chHtml += flips.map(f => `
            <div class="chg-row">
              <span style="font-weight:600">${esc(f.name)}</span>
              <span class="mu">${esc(f.from)}</span>
              <span>→ ${esc(f.to)}</span>
              <span class="flip-tag ${f.dir === "down" ? "delta-neg" : "delta-pos"}">${esc(f.dir || "")}</span>
            </div>`).join("");
        }
        if (moves.length) {
          chHtml += `<div class="sec-hd" style="border-top:1px solid #222">MOVES</div>` +
            moves.map(m => {
              const dlt = m.delta;
              const cls = dlt > 0 ? "delta-pos" : dlt < 0 ? "delta-neg" : "";
              return `<div class="chg-row">
                <span>${esc(m.name)}</span>
                <span class="mono mu">${esc(fmtVal(m.prev))}</span>
                <span class="mono">${esc(fmtVal(m.now))}</span>
                <span class="mono ${cls}">${dlt == null ? "—" : (dlt > 0 ? "+" : "") + esc(fmtVal(dlt))}</span>
              </div>`;
            }).join("");
        }
        document.getElementById("changes").innerHTML = chHtml;

        const v = d.verdict || {};
        const adv = v.advice || {};
        const empty = adv.empty || [];
        const holding = adv.holding || [];
        const strat = d.strategy?.summary || "";
        document.getElementById("verdict").innerHTML = `
          <div class="verdict-body">${esc(v.summary || "—")}</div>
          <div class="adv-block">
            <h4>空仓</h4>
            ${empty.map(t => `<div class="adv-li">${esc(t)}</div>`).join("") || `<div class="mu" style="padding:6px 10px">—</div>`}
            <h4>持仓</h4>
            ${holding.map(t => `<div class="adv-li">${esc(t)}</div>`).join("") || `<div class="mu" style="padding:6px 10px">—</div>`}
          </div>
          ${strat ? `<div class="strat">${esc(strat)}</div>` : ""}`;


        // —— charts (Bloomberg shell colors) ——
        const BB = "#ffa028", POS = "#ef5350", NEG = "#26a69a", MU = "#a0a0a0", GRID = "#1a1a1a";
        function mkChart(id) {
          const el = document.getElementById(id);
          if (!el || !window.echarts) return null;
          const c = echarts.init(el, null, { renderer: "canvas" });
          window.addEventListener("resize", () => c.resize());
          return c;
        }
        const g = mkChart("chartGauge");
        if (g) {
          const pct = total ? trig / total : 0;
          g.setOption({
            backgroundColor: "transparent",
            series: [{
              type: "gauge",
              startAngle: 210, endAngle: -30,
              min: 0, max: total,
              splitNumber: total,
              radius: "90%",
              axisLine: {
                lineStyle: {
                  width: 12,
                  color: [
                    [5 / total, MU],
                    [8 / total, BB],
                    [9 / total, "#ffb74d"],
                    [1, POS],
                  ],
                },
              },
              pointer: { length: "62%", width: 4, itemStyle: { color: BB } },
              axisTick: { show: false },
              splitLine: { length: 8, lineStyle: { color: "#333", width: 1 } },
              axisLabel: { color: MU, fontSize: 9, distance: 12 },
              anchor: { show: true, size: 8, itemStyle: { color: BB } },
              title: { show: true, offsetCenter: [0, "68%"], color: MU, fontSize: 11 },
              detail: {
                valueAnimation: true,
                formatter: `{value}/${total}`,
                color: BB, fontSize: 22, fontWeight: 700,
                fontFamily: "SF Mono, Menlo, Consolas, monospace",
                offsetCenter: [0, "40%"],
              },
              data: [{ value: trig, name: label }],
            }],
          });
        }
        const groups = (d.verdict && d.verdict.groups) || [];
        const cg = mkChart("chartGroups");
        if (cg && groups.length) {
          cg.setOption({
            backgroundColor: "transparent",
            grid: { left: 72, right: 24, top: 16, bottom: 28 },
            xAxis: {
              type: "value", max: Math.max(...groups.map(x => x.total || 0), 1),
              splitLine: { lineStyle: { color: GRID } },
              axisLabel: { color: MU, fontSize: 10 },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
            },
            yAxis: {
              type: "category",
              data: groups.map(x => x.name),
              axisLabel: { color: "#e8e8e8", fontSize: 11 },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
              axisTick: { show: false },
            },
            series: [{
              type: "bar",
              data: groups.map(x => ({
                value: x.triggered ?? 0,
                itemStyle: { color: (x.triggered ?? 0) > 0 ? POS : "#333" },
              })),
              barWidth: 12,
              label: {
                show: true, position: "right", color: MU, fontSize: 10,
                formatter: (p) => `${p.value}/${groups[p.dataIndex].total ?? "—"}`,
              },
            }],
          });
        }
        const near = (d.verdict && d.verdict.nearest) || [];
        const cn = mkChart("chartNear");
        if (cn && near.length) {
          const names = near.map(x => x.name).reverse();
          const vals = near.map(x => Math.round((x.progress ?? 0) * 1000) / 10).reverse();
          cn.setOption({
            backgroundColor: "transparent",
            grid: { left: 88, right: 40, top: 16, bottom: 28 },
            xAxis: {
              type: "value", min: 0, max: 100,
              axisLabel: { color: MU, fontSize: 10, formatter: "{value}%" },
              splitLine: { lineStyle: { color: GRID } },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
            },
            yAxis: {
              type: "category", data: names,
              axisLabel: { color: "#e8e8e8", fontSize: 11 },
              axisTick: { show: false },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
            },
            series: [{
              type: "bar",
              data: vals.map(v => ({
                value: v,
                itemStyle: { color: v >= 95 ? POS : v >= 70 ? BB : MU },
              })),
              barWidth: 10,
              label: { show: true, position: "right", color: MU, fontSize: 10, formatter: "{c}%" },
            }],
          });
        }


        // —— history time-series (kline / basis / margin) ——
        (function renderHistory(hist) {
          const wrap = document.getElementById("chartsHist");
          if (!wrap || !hist || !window.echarts) {
            if (wrap) wrap.hidden = true;
            return;
          }
          const klineAll = hist.csi1000_kline || [];
          const basisAll = hist.im_basis || [];
          const marginAll = hist.margin_balance || [];
          if (!klineAll.length && !basisAll.length && !marginAll.length) {
            wrap.hidden = true;
            return;
          }
          wrap.hidden = false;

          const BB = "#ffa028", POS = "#ef5350", NEG = "#26a69a", MU = "#a0a0a0", GRID = "#1a1a1a";
          const theme = (window.DashTheme && DashTheme.echartsDark) || null;
          const N = 80;
          function mk(id) {
            const el = document.getElementById(id);
            if (!el) return null;
            const c = echarts.init(el, theme, { renderer: "canvas" });
            window.addEventListener("resize", () => c.resize());
            return c;
          }
          function axisCat(dates) {
            return {
              type: "category", data: dates, boundaryGap: true,
              axisLabel: { color: MU, fontSize: 10, hideOverlap: true },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
              axisTick: { show: false },
            };
          }
          function axisVal(extra) {
            return Object.assign({
              type: "value", scale: true,
              axisLabel: { color: MU, fontSize: 10 },
              splitLine: { lineStyle: { color: GRID } },
              axisLine: { lineStyle: { color: "#2b2b2b" } },
            }, extra || {});
          }

          const kl = klineAll.slice(-N);
          const ck = mk("chartKline");
          if (ck && kl.length) {
            const dates = kl.map(x => x.d);
            const ohlc = kl.map(x => [x.o, x.c, x.l, x.h]);
            const yinMarks = kl.filter(x => x.big_yin).map(x => ({
              coord: [x.d, x.l],
              symbol: "circle",
              symbolSize: 5,
              itemStyle: { color: "rgba(255,160,40,0.45)", borderColor: BB, borderWidth: 1 },
            }));
            ck.setOption({
              backgroundColor: "transparent",
              animation: false,
              grid: { left: 52, right: 16, top: 20, bottom: 28 },
              tooltip: {
                trigger: "axis",
                axisPointer: { type: "cross", lineStyle: { color: "#333" } },
                backgroundColor: "#0a0a0a", borderColor: "#333", textStyle: { color: "#e8e8e8", fontSize: 11 },
              },
              xAxis: axisCat(dates),
              yAxis: axisVal({ scale: true }),
              series: [{
                type: "candlestick",
                name: "中证1000",
                data: ohlc,
                itemStyle: {
                  color: POS, color0: NEG,
                  borderColor: POS, borderColor0: NEG,
                },
                markPoint: yinMarks.length ? {
                  data: yinMarks,
                  label: { show: false },
                  tooltip: { formatter: "大阴" },
                } : undefined,
              }],
            });
          }

          const bas = basisAll.slice(-N);
          const cb = mk("chartBasis");
          if (cb && bas.length) {
            const dates = bas.map(x => x.d);
            const vals = bas.map(x => x.v);
            cb.setOption({
              backgroundColor: "transparent",
              animation: false,
              grid: { left: 48, right: 16, top: 20, bottom: 28 },
              tooltip: {
                trigger: "axis",
                backgroundColor: "#0a0a0a", borderColor: "#333", textStyle: { color: "#e8e8e8", fontSize: 11 },
              },
              xAxis: axisCat(dates),
              yAxis: axisVal(),
              series: [{
                type: "line", name: "IM贴水",
                data: vals, showSymbol: false,
                lineStyle: { width: 1.5, color: BB },
                itemStyle: { color: BB },
                markLine: {
                  silent: true, symbol: "none",
                  data: [{ yAxis: 160, name: "红线 160" }],
                  lineStyle: { color: POS, width: 1, type: "dashed" },
                  label: { color: POS, fontSize: 10, formatter: "160" },
                },
              }],
            });
          }

          const mb = marginAll.slice(-N);
          const cm = mk("chartMargin");
          if (cm && mb.length) {
            const dates = mb.map(x => x.d);
            const vals = mb.map(x => x.v);
            cm.setOption({
              backgroundColor: "transparent",
              animation: false,
              grid: { left: 48, right: 16, top: 20, bottom: 28 },
              tooltip: {
                trigger: "axis",
                backgroundColor: "#0a0a0a", borderColor: "#333", textStyle: { color: "#e8e8e8", fontSize: 11 },
              },
              xAxis: axisCat(dates),
              yAxis: axisVal(),
              series: [{
                type: "line", name: "融资余额",
                data: vals, showSymbol: false,
                lineStyle: { width: 1.5, color: BB },
                itemStyle: { color: BB },
                markLine: {
                  silent: true, symbol: "none",
                  data: [{ yAxis: 2.45, name: "红线 2.45" }],
                  lineStyle: { color: POS, width: 1, type: "dashed" },
                  label: { color: POS, fontSize: 10, formatter: "2.45" },
                },
              }],
            });
          }
        })(hist);

        document.getElementById("foot").textContent =
          d.disclaimer || "仅供学习研究，不构成投资建议；市场有风险";
      })
      .catch(e => {
        document.getElementById("meta").textContent = "无法加载 bottom.json：" + e.message;
        document.getElementById("hero").textContent = "加载失败";
      });
  </script>
</body>
</html>
