<!-- 情绪日历片段：仿 src/components/CalendarOverviewPage.vue（月历）+ CalendarTrendChart.vue（沪深300/仓位走势）
     依赖：../assets/theme.css 的 CSS 变量（缺失时用下方兜底值）；数据：./data/history.json
     合并方式：把 <style>、<section id="emo-cal"> 和 <script> 原样拷进 index.html；
     点击某天会触发 window 事件 "emo:day-select"（detail.date=YYYYMMDD），并写 location.hash = #day-YYYYMMDD，
     index.html 里监听其一即可联动当日详情。 -->
<style>
#emo-cal{--c-bg:var(--bg,#000);--c-row:var(--row,#1a1a1a);--c-bd:var(--bd,#2b2b2b);--c-tx:var(--tx,#e8e8e8);--c-mu:var(--mu,#a0a0a0);--c-mu3:var(--mu-3,#5c5c5c);--c-amber:var(--bb,#FFA028);--c-up:var(--pos,#ef5350);--c-down:var(--neg,#26a69a);--c-blu:var(--blu,#64b5f6);
  background:var(--c-bg);color:var(--c-tx);font-family:var(--sans,sans-serif);border:1px solid var(--c-bd);padding:14px;max-width:var(--max,1280px);margin:0 auto}
#emo-cal .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:var(--hair,1px solid #2b2b2b);padding-bottom:8px;margin-bottom:10px}
#emo-cal .kick{color:var(--c-amber);font:700 11px var(--mono,monospace);letter-spacing:.14em;text-transform:uppercase}
#emo-cal h2{margin:2px 0 0;font-size:18px;color:var(--c-amber)}
#emo-cal .bar{display:flex;align-items:center;gap:8px}
#emo-cal button.nav{background:transparent;border:1px solid var(--c-bd);color:var(--c-amber);font:12px var(--mono,monospace);padding:4px 10px;cursor:pointer;border-radius:var(--r-sm,0)}
#emo-cal button.nav:disabled{color:var(--c-mu3);cursor:default}
#emo-cal .ml{font:700 15px var(--mono,monospace);min-width:96px;text-align:center}
#emo-cal .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--c-bd);border:1px solid var(--c-bd);margin-bottom:10px}
#emo-cal .stats div{background:var(--c-bg);padding:6px 8px;font-size:11px;color:var(--c-mu)}
#emo-cal .stats b{display:block;font:700 15px var(--mono,monospace);color:var(--c-tx);font-variant-numeric:tabular-nums}
#emo-cal .wk,#emo-cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#emo-cal .wk span{text-align:center;font-size:12px;font-weight:700;color:var(--c-mu);padding:4px 0}
#emo-cal .cell{min-height:96px;padding:8px;border:1px solid var(--c-bd);background:var(--c-row);text-align:left;color:var(--c-tx);font:12px var(--sans,sans-serif);cursor:pointer;transition:border-color .15s}
#emo-cal .cell:hover:not(:disabled){border-color:var(--c-amber)}
#emo-cal .cell:disabled{cursor:default}
#emo-cal .cell.empty{background:transparent;border-color:transparent}
#emo-cal .cell.open{background:color-mix(in srgb,var(--c-up) 12%,transparent);border-color:color-mix(in srgb,var(--c-up) 35%,transparent)}
#emo-cal .cell.blocked{background:color-mix(in srgb,var(--c-down) 12%,transparent);border-color:color-mix(in srgb,var(--c-down) 35%,transparent)}
#emo-cal .cell.off,#emo-cal .cell.future{background:transparent;color:var(--c-mu3)}
#emo-cal .cell.sel{outline:2px solid var(--c-amber);outline-offset:-2px}
#emo-cal .d{font:700 18px var(--mono,monospace)}
#emo-cal .s,#emo-cal .p,#emo-cal .st{margin-top:4px;line-height:1.35;font-variant-numeric:tabular-nums}
#emo-cal .st{font-weight:700}
#emo-cal .open .st{color:var(--c-up)} #emo-cal .blocked .st{color:var(--c-down)}
#emo-cal .trend{margin-top:14px;border-top:var(--hair,1px solid #2b2b2b);padding-top:8px}
#emo-cal .trend .th{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--c-mu)}
#emo-cal .trend .th b{color:var(--c-amber)}
#emo-cal .rg button{background:transparent;border:1px solid var(--c-bd);color:var(--c-mu);font:11px var(--mono,monospace);padding:3px 8px;cursor:pointer}
#emo-cal .rg button.on{color:#000;background:var(--c-amber);border-color:var(--c-amber)}
#emo-cal svg text{fill:var(--c-mu);font:10px var(--mono,monospace)}
@media(max-width:820px){#emo-cal .cell{min-height:80px;padding:6px}#emo-cal .stats{grid-template-columns:repeat(3,1fr)}}
</style>

<section id="emo-cal">
  <div class="hd">
    <div><div class="kick">Calendar Overview</div><h2>情绪日历总览</h2></div>
    <div class="bar"><button class="nav" data-act="prev">上月</button><span class="ml"></span><button class="nav" data-act="next">下月</button></div>
  </div>
  <div class="stats"></div>
  <div class="wk"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
  <div class="grid"></div>
  <div class="trend">
    <div class="th"><span><b>趋势总览</b> 沪深300收盘（蓝）与建议仓位（琥珀），点击数据点联动当日详情</span>
      <span class="rg"><button data-r="1">1m</button><button data-r="3" class="on">3m</button><button data-r="6">6m</button><button data-r="12">1y</button></span></div>
    <svg class="chart" viewBox="0 0 1000 220" width="100%"></svg>
  </div>
</section>

<script>
(function () {
  const root = document.getElementById('emo-cal');
  const $ = (s) => root.querySelector(s);
  let days = [], map = {}, months = [], mi = 0, sel = null, range = 3;
  const ymd = (d) => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const today = ymd(new Date());

  function select(date) {
    sel = date;
    const i = months.indexOf(date.slice(0, 6)); if (i >= 0) mi = i;
    render();
    history.replaceState(null, '', '#day-' + date);
    window.dispatchEvent(new CustomEvent('emo:day-select', { detail: { date, day: map[date] } }));
  }

  function render() {
    const m = months[mi], y = +m.slice(0, 4), mo = +m.slice(4, 6);
    $('.ml').textContent = y + '年' + mo + '月';
    root.querySelector('[data-act=prev]').disabled = mi <= 0;
    root.querySelector('[data-act=next]').disabled = mi >= months.length - 1;
    const md = days.filter((d) => d.date.startsWith(m));
    const open = md.filter((d) => d.allowOpen).length;
    const avg = (k) => md.length ? (md.reduce((s, d) => s + d[k], 0) / md.length) : 0;
    const cnt = (r) => md.filter((d) => d.regime === r).length;
    $('.stats').innerHTML = [
      ['交易日', md.length], ['可开仓', open], ['暂停开仓', md.length - open],
      ['平均情绪', avg('emotionScore').toFixed(1)], ['平均仓位', avg('suggestedPosition').toFixed(0) + '%'],
      ['强/中/弱', cnt('strong') + '/' + cnt('neutral') + '/' + cnt('weak')],
    ].map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('');
    const first = new Date(y, mo - 1, 1).getDay(), lead = first === 0 ? 6 : first - 1, total = new Date(y, mo, 0).getDate();
    const first0 = days[0].date, last0 = days[days.length - 1].date;
    let html = '<div class="cell empty"></div>'.repeat(lead);
    for (let i = 1; i <= total; i++) {
      const ds = m + String(i).padStart(2, '0'), d = map[ds], wd = new Date(y, mo - 1, i).getDay();
      let cls = 'cell', st;
      if (d) { cls += d.allowOpen ? ' open' : ' blocked'; st = d.allowOpen ? '可开仓' : '暂停开仓'; }
      else if (ds > today || ds > last0) { cls += ' future'; st = ds > today ? '未到交易日' : '待获取'; }
      else { cls += ' off'; st = (wd === 0 || wd === 6 || (ds >= first0)) ? '非交易日' : '无数据'; }
      if (ds === sel) cls += ' sel';
      html += `<button type="button" class="${cls}" data-d="${ds}" ${d ? '' : 'disabled'} title="${d ? d.regimeLabel : st}">
        <div class="d">${i}</div><div class="s">情绪 ${d ? d.emotionScore.toFixed(1) : '--'}</div>
        <div class="p">仓位 ${d ? d.suggestedPosition + '%' : '--'}</div><div class="st">${st}</div></button>`;
    }
    $('.grid').innerHTML = html;
    drawTrend();
  }

  function drawTrend() {
    const W = 1000, H = 220, L = 46, R = 42, T = 12, B = 22;
    const end = days[days.length - 1].date;
    const ed = new Date(+end.slice(0, 4), +end.slice(4, 6) - 1 - range, +end.slice(6));
    const s = days.filter((d) => d.date > ymd(ed));
    if (s.length < 2) { $('.chart').innerHTML = ''; return; }
    const cs = s.map((d) => d.hs300Close), lo = Math.min(...cs), hi = Math.max(...cs);
    const x = (i) => L + i * (W - L - R) / (s.length - 1);
    const yc = (v) => T + (hi - v) * (H - T - B) / ((hi - lo) || 1);
    const yp = (v) => T + (100 - v) * (H - T - B) / 100;
    const line = (f) => s.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + f(d).toFixed(1)).join('');
    let g = '';
    [0, 50, 100].forEach((v) => { g += `<line x1="${L}" x2="${W - R}" y1="${yp(v)}" y2="${yp(v)}" stroke="var(--c-bd)"/><text x="${W - R + 4}" y="${yp(v) + 3}">${v}%</text>`; });
    [lo, (lo + hi) / 2, hi].forEach((v) => { g += `<text x="${L - 4}" y="${yc(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
    g += `<path d="${line((d) => yc(d.hs300Close))}" fill="none" stroke="var(--c-blu)" stroke-width="2"/>`;
    g += `<path d="${line((d) => yp(d.suggestedPosition))}" fill="none" stroke="var(--c-amber)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const step = Math.max(1, Math.ceil(s.length / 8));
    s.forEach((d, i) => {
      const on = d.date === sel;
      g += `<circle cx="${x(i)}" cy="${yc(d.hs300Close)}" r="${on ? 5 : 2.5}" fill="${on ? 'var(--c-amber)' : 'var(--c-blu)'}" data-d="${d.date}" style="cursor:pointer"><title>${d.date} 沪深300 ${d.hs300Close} 仓位 ${d.suggestedPosition}% 情绪 ${d.emotionScore}</title></circle>`;
      if (i % step === 0 || i === s.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${d.date.slice(4, 6)}-${d.date.slice(6)}</text>`;
    });
    $('.chart').innerHTML = g;
  }

  root.addEventListener('click', (e) => {
    const n = e.target.closest('[data-d],[data-act],[data-r]'); if (!n || n.disabled) return;
    if (n.dataset.d && map[n.dataset.d]) return select(n.dataset.d);
    if (n.dataset.act) { mi += n.dataset.act === 'prev' ? -1 : 1; mi = Math.max(0, Math.min(months.length - 1, mi)); render(); }
    if (n.dataset.r) { range = +n.dataset.r; root.querySelectorAll('.rg button').forEach((b) => b.classList.toggle('on', b === n)); drawTrend(); }
  });

  fetch('./data/history.json', { cache: 'no-cache' }).then((r) => r.json()).then((j) => {
    days = (j.days || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    if (!days.length) return;
    days.forEach((d) => { map[d.date] = d; });
    months = [...new Set(days.map((d) => d.date.slice(0, 6)))];
    const h = (location.hash.match(/day-(\d{8})/) || [])[1];
    sel = h && map[h] ? h : days[days.length - 1].date;
    mi = months.indexOf(sel.slice(0, 6));
    render();
  }).catch((e) => { root.querySelector('.grid').textContent = '数据加载失败：' + e.message; });
})();
</script>
