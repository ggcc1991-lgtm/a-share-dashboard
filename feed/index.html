<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>信息聚合 · GC的数据监控中心</title>
  <link rel="stylesheet" href="../assets/theme.css" />
</head>
<body>
  <header class="app-header">
    <div class="inner">
      <div class="brand"><div class="brand-mark"></div><h1>GC的数据<span>监控</span>中心</h1></div>
            <nav class="nav">
        <a href="../" data-match="/">总览</a>
        <div class="nav-dd" data-match="/etf">
          <button type="button" class="nav-dd-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dd-etf">ETF<span class="nav-dd-caret" aria-hidden="true">▾</span></button>
          <div class="nav-dd-panel" id="nav-dd-etf" role="menu" aria-label="ETF">
            <a href="../etf/" role="menuitem">国家队追踪</a>
            <a href="../sentiment/" role="menuitem">情绪看板</a>
            <a href="../momentum/" role="menuitem">动量排名</a>
          </div>
        </div>
        <a href="../feed/" data-match="/feed" class="active">信息流</a>
        <a href="../bottom/" data-match="/bottom">抄底信号</a>
        <a href="../policy/" data-match="/policy">政策产业</a>
        <a href="../earnings/" data-match="/earnings">财报会议</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">信息流</h2>
    <p class="page-sub" id="meta">加载 data/feed.json …</p>

    <section id="feed-analysis" class="panel fa-panel" aria-label="实时分析" hidden></section>

    <div class="grid grid-4" id="kpis" style="margin-bottom:12px"></div>
    <div class="tools">
      <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <input class="search" id="q" type="search" placeholder="搜索标题 / 来源 / 摘要" />
    </div>
    <div id="list"></div>
  </main>
  <footer class="app-footer">字段：source / sourceName / title / url / publishedAt / summary · 分析：data/feed-analysis.json</footer>
  <script src="../assets/shell.js"></script>
  <script src="../assets/echarts.min.js"></script>
  <script>
    const SRC = { mp: "公众号", x: "X", zsxq: "星球", rss: "RSS", feishu: "飞书" };
    let items = [];
    let filter = "all";
    let q = "";
    const faCharts = [];

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function dayKey(iso) {
      if (!iso) return "未知日期";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso).slice(0, 10);
      return d.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });
    }

    function filtered() {
      const qq = q.trim().toLowerCase();
      return items.filter((x) => {
        if (filter !== "all" && x.source !== filter) return false;
        if (!qq) return true;
        const blob = `${x.title || ""} ${x.sourceName || ""} ${x.summary || ""} ${x.source || ""}`.toLowerCase();
        return blob.includes(qq);
      });
    }

    function render() {
      const rows = filtered().sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
      const list = document.getElementById("list");
      if (!rows.length) {
        list.innerHTML = `<div class="empty">没有匹配条目</div>`;
        return;
      }
      const groups = new Map();
      rows.forEach((x) => {
        const k = dayKey(x.publishedAt);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(x);
      });
      list.innerHTML = [...groups.entries()].map(([day, arr]) => `
        <section class="day-group">
          <h3>${day}<span class="chip">${arr.length}</span></h3>
          <div class="grid" style="gap:10px">
            ${arr.map((x) => `
              <article class="feed-item">
                <div class="feed-meta">
                  <span class="chip src">${SRC[x.source] || x.source}</span>
                  <span>${esc(x.sourceName || "")}</span>
                  <span class="mono">${DashFmt.time(x.publishedAt)}</span>
                </div>
                <h3><a href="${esc(x.url || "#")}" ${x.url && x.url !== "#" ? 'target="_blank" rel="noopener"' : ""}>${esc(x.title || "无标题")}</a></h3>
                <p class="feed-sum">${esc(x.summary || "")}</p>
              </article>`).join("")}
          </div>
        </section>`).join("");
    }

    const STR_RANK = { "极强": 5, "强": 4, "中强": 3, "中": 2, "中低": 1, "弱": 0.5 };
    const CONF_RANK = { "高": 3, "中高": 2.5, "中": 2, "中低": 1, "低": 0.5 };
    const AMBER = "#FFA028";

    function confClass(c) {
      const s = String(c || "");
      if (s.includes("高") && !s.includes("中")) return "high";
      if (s.includes("中")) return "mid";
      return "low";
    }
    function strengthVal(s) {
      return STR_RANK[s] != null ? STR_RANK[s] : 1;
    }
    function confVal(s) {
      return CONF_RANK[s] != null ? CONF_RANK[s] : 1;
    }

    function disposeFaCharts() {
      while (faCharts.length) {
        try { faCharts.pop().dispose(); } catch (_) {}
      }
    }

    function ensureAmberTheme() {
      if (!window.echarts || ensureAmberTheme._done) return;
      const base = (window.DashTheme && DashTheme.echartsDark) || {};
      echarts.registerTheme("amber-dark", Object.assign({}, base, {
        color: (window.DashTheme && DashTheme.colors) || [AMBER, "#ef5350", "#26a69a", "#ffb74d", "#64b5f6", "#a0a0a0"],
        backgroundColor: "transparent",
      }));
      ensureAmberTheme._done = true;
    }

    function initChart(el, option) {
      if (!el || !window.echarts) return null;
      ensureAmberTheme();
      const c = echarts.init(el, "amber-dark", { renderer: "canvas" });
      c.setOption(option);
      faCharts.push(c);
      return c;
    }

    function chartColors() {
      return (window.DashTheme && DashTheme.colors) || [AMBER, "#ef5350", "#26a69a", "#ffb74d", "#64b5f6", "#a0a0a0"];
    }

    function axisMuted() {
      return {
        axisLabel: { color: "#a0a0a0", fontSize: 10 },
        axisLine: { lineStyle: { color: "#2a2210" } },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: "#1a160c" } },
      };
    }

    function formatShanghaiShort(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        const parts = new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", hour12: false,
        }).formatToParts(d);
        const get = (t) => (parts.find((p) => p.type === t) || {}).value || "";
        return `${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")}`;
      } catch (_) {
        return "";
      }
    }

    function panelHeading(d) {
      const hints = (d && d.uiHints) || {};
      const base = (hints.panelTitle && String(hints.panelTitle).trim()) || "实时分析";
      let ts = (d && d.generatedAtDisplay && String(d.generatedAtDisplay).trim()) || "";
      if (!ts) {
        ts = formatShanghaiShort(d.analyzedAt || d.updated || d.generatedAt || "");
      }
      return ts ? `${base} · ${ts}` : base;
    }

    /** Only remaining viz charts: keywordBars, confidenceDonut, opportunityScores */
    function resolveVizSeries(d) {
      const viz = (d && d.viz) || {};
      const keywords = Array.isArray(d.keywords) ? d.keywords : [];
      const opps = Array.isArray(d.opportunities) ? d.opportunities : [];

      let keywordBars = Array.isArray(viz.keywordBars) ? viz.keywordBars.slice() : null;
      if (!keywordBars || !keywordBars.length) {
        keywordBars = keywords.map((k) => {
          const term = typeof k === "string" ? k : (k && k.term) || "";
          const strength = typeof k === "object" && k ? k.strength : "";
          return { label: term, value: strengthVal(strength), strength: strength || "" };
        }).filter((x) => x.label);
      }

      let confidenceDonut = Array.isArray(viz.confidenceDonut) ? viz.confidenceDonut.slice() : null;
      if (!confidenceDonut || !confidenceDonut.length) {
        const counts = {};
        opps.forEach((o) => {
          const c = (o && o.confidence) || "未知";
          counts[c] = (counts[c] || 0) + 1;
        });
        confidenceDonut = Object.entries(counts).map(([label, value]) => ({ label, value }));
      }

      let opportunityScores = Array.isArray(viz.opportunityScores) ? viz.opportunityScores.slice() : null;
      if (!opportunityScores || !opportunityScores.length) {
        opportunityScores = opps.map((o) => {
          const title = (o && o.title) || "—";
          const conf = (o && o.confidence) || "";
          const short = title.length > 18 ? title.slice(0, 17) + "…" : title;
          return { label: short, value: confVal(conf), confidence: conf };
        });
      }

      return { keywordBars, confidenceDonut, opportunityScores };
    }

    function hBarOption(labels, values, extraLabels) {
      const colors = chartColors();
      const muted = axisMuted();
      return {
        color: colors,
        grid: { left: 4, right: 36, top: 4, bottom: 2, containLabel: true },
        xAxis: Object.assign({ type: "value", axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: muted.splitLine }, {}),
        yAxis: {
          type: "category",
          data: labels,
          axisLabel: Object.assign({}, muted.axisLabel, { width: 96, overflow: "truncate" }),
          axisLine: muted.axisLine,
          axisTick: { show: false },
        },
        series: [{
          type: "bar",
          data: values.map((v, i) => ({
            value: v,
            itemStyle: { color: colors[i % colors.length], borderRadius: [0, 2, 2, 0] },
          })),
          barWidth: 8,
          label: {
            show: true,
            position: "right",
            formatter: (p) => {
              if (extraLabels && extraLabels[p.dataIndex] != null) return String(extraLabels[p.dataIndex]);
              return String(p.value);
            },
            color: "#787878",
            fontSize: 9,
          },
        }],
      };
    }

    function pieOption(items, { donut } = {}) {
      const colors = chartColors();
      return {
        color: colors,
        tooltip: { trigger: "item", confine: true },
        series: [{
          type: "pie",
          radius: donut ? ["48%", "72%"] : ["28%", "68%"],
          center: ["42%", "50%"],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: "#0c0a06", borderWidth: 2 },
          label: { color: "#a0a0a0", fontSize: 10, formatter: "{b}" },
          labelLine: { length: 6, length2: 4, lineStyle: { color: "#3a2a10" } },
          data: items.map((it) => ({
            name: it.name,
            value: it.value,
          })),
        }],
        legend: {
          orient: "vertical",
          right: 0,
          top: "middle",
          textStyle: { color: "#787878", fontSize: 10 },
          itemWidth: 8,
          itemHeight: 8,
          itemGap: 4,
          formatter: (name) => {
            const hit = items.find((x) => x.name === name);
            return hit ? `${name} ${hit.value}` : name;
          },
        },
      };
    }

    function renderFaCharts(series) {
      disposeFaCharts();
      const { keywordBars, confidenceDonut, opportunityScores } = series;

      const kwEl = document.getElementById("fa-chart-kw");
      if (kwEl && keywordBars.length) {
        const rev = keywordBars.slice().reverse();
        initChart(kwEl, hBarOption(
          rev.map((x) => x.label || ""),
          rev.map((x) => +x.value || 0),
          rev.map((x) => x.strength || x.value)
        ));
      }

      const confEl = document.getElementById("fa-chart-conf");
      if (confEl && confidenceDonut.length) {
        initChart(confEl, pieOption(confidenceDonut.map((x) => ({
          name: x.label,
          value: +x.value || 0,
        })), { donut: true }));
      }

      const oppEl = document.getElementById("fa-chart-opp");
      if (oppEl && opportunityScores.length) {
        const rev = opportunityScores.slice().reverse();
        initChart(oppEl, hBarOption(
          rev.map((x) => x.label || ""),
          rev.map((x) => +x.value || 0),
          rev.map((x) => x.confidence || x.value)
        ));
      }

      requestAnimationFrame(() => faCharts.forEach((c) => { try { c.resize(); } catch (_) {} }));
    }

    function linkListHtml(links) {
      if (!Array.isArray(links) || !links.length) return "";
      return `<div class="fa-opp-links">${links.map((l) => {
        const t = (l && l.title) || "来源";
        const u = l && l.url;
        if (u) return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`;
        return `<span>${esc(t)}</span>`;
      }).join("")}</div>`;
    }

    function bulletsHtml(items, extraClass) {
      if (!Array.isArray(items) || !items.length) return "";
      const cls = extraClass ? `fa-list ${extraClass}` : "fa-list";
      return `<ul class="${cls}">${items.map((x) => `<li>${esc(typeof x === "string" ? x : String(x))}</li>`).join("")}</ul>`;
    }

    /** Prefer prose.*; fallback to older structured fields */
    function resolveProseBlocks(d) {
      const prose = (d && d.prose && typeof d.prose === "object") ? d.prose : null;
      const blocks = [];

      const lead = prose && typeof prose.lead === "string" && prose.lead.trim()
        ? prose.lead.trim()
        : (d.title || d.changeSummary || "");
      if (lead) blocks.push({ kind: "lead", text: lead });

      const sampleNote = prose && typeof prose.sampleNote === "string" ? prose.sampleNote.trim() : "";
      if (sampleNote) blocks.push({ kind: "note", text: sampleNote });
      else if (!prose && d.changeSummary && d.title && d.changeSummary !== lead) {
        blocks.push({ kind: "note", text: d.changeSummary });
      }

      // Opportunities
      let oppItems = null;
      if (prose && Array.isArray(prose.opportunitiesText) && prose.opportunitiesText.length) {
        oppItems = prose.opportunitiesText.map((o) => ({
          title: (o && (o.headline || o.title)) || "—",
          confidence: (o && o.confidence) || "",
          rationale: (o && (o.body || o.rationale)) || "",
          sources: Array.isArray(o && o.links) ? o.links : (Array.isArray(o && o.sources) ? o.sources : []),
        }));
      } else if (Array.isArray(d.opportunities) && d.opportunities.length) {
        oppItems = d.opportunities.map((o) => ({
          title: (o && o.title) || "—",
          confidence: (o && o.confidence) || "",
          rationale: (o && o.rationale) || "",
          sources: Array.isArray(o && o.sources) ? o.sources : [],
        }));
      }
      if (oppItems && oppItems.length) blocks.push({ kind: "opportunities", items: oppItems });

      // Consensus
      let agree = null, disagree = null;
      if (prose && prose.consensusText && typeof prose.consensusText === "object") {
        agree = Array.isArray(prose.consensusText.agreement) ? prose.consensusText.agreement : [];
        disagree = Array.isArray(prose.consensusText.disagreement) ? prose.consensusText.disagreement : [];
      } else if (d.consensus && typeof d.consensus === "object") {
        agree = Array.isArray(d.consensus.agreement) ? d.consensus.agreement : [];
        disagree = Array.isArray(d.consensus.disagreement) ? d.consensus.disagreement : [];
      }
      if ((agree && agree.length) || (disagree && disagree.length)) {
        blocks.push({ kind: "consensus", agreement: agree || [], disagreement: disagree || [] });
      }

      // Risks
      let risks = null;
      if (prose && Array.isArray(prose.risksText) && prose.risksText.length) risks = prose.risksText;
      else if (Array.isArray(d.risks) && d.risks.length) risks = d.risks;
      if (risks && risks.length) blocks.push({ kind: "risks", items: risks });

      // Narrative
      let narr = null;
      if (prose && Array.isArray(prose.narrativeText) && prose.narrativeText.length) narr = prose.narrativeText;
      else if (Array.isArray(d.narrativeShifts) && d.narrativeShifts.length) narr = d.narrativeShifts;
      if (narr && narr.length) blocks.push({ kind: "narrative", items: narr });

      // Watch / time windows
      let watch = null;
      if (prose && Array.isArray(prose.watchText) && prose.watchText.length) {
        watch = prose.watchText.map((x) => typeof x === "string" ? x : String(x));
      } else if (Array.isArray(d.timeWindows) && d.timeWindows.length) {
        watch = d.timeWindows.map((w) => {
          if (typeof w === "string") return w;
          const h = (w && w.horizon) || "";
          const wt = (w && w.watch) || "";
          return h && wt ? `${h}：${wt}` : (h || wt);
        }).filter(Boolean);
      }
      if (watch && watch.length) blocks.push({ kind: "watch", items: watch });

      // Highlights (structured fallback / supplement)
      const highlights = Array.isArray(d.highlights) ? d.highlights : [];
      if (highlights.length && !(oppItems && oppItems.length)) {
        blocks.push({ kind: "highlights", items: highlights });
      }

      const disclaimer = prose && typeof prose.disclaimer === "string" ? prose.disclaimer.trim() : "";
      if (disclaimer) blocks.push({ kind: "disclaimer", text: disclaimer });

      return blocks;
    }

    function renderProseHtml(blocks) {
      if (!blocks || !blocks.length) return "";
      let html = `<div class="fa-prose">`;
      for (const b of blocks) {
        if (b.kind === "lead") {
          html += `<p class="fa-prose-lead">${esc(b.text)}</p>`;
        } else if (b.kind === "note") {
          html += `<p class="fa-prose-note">${esc(b.text)}</p>`;
        } else if (b.kind === "opportunities") {
          html += `<section class="fa-sec fa-prose-sec"><div class="fa-sec-h">机会精读</div>`;
          html += b.items.map((o) => `
            <article class="fa-opp">
              <div class="fa-opp-top">
                <span class="fa-opp-t">${esc(o.title)}</span>
                ${o.confidence ? `<span class="chip conf ${confClass(o.confidence)}">${esc(o.confidence)}</span>` : ""}
              </div>
              ${o.rationale ? `<p class="fa-opp-r">${esc(o.rationale)}</p>` : ""}
              ${linkListHtml(o.sources)}
            </article>`).join("");
          html += `</section>`;
        } else if (b.kind === "consensus") {
          html += `<section class="fa-sec fa-prose-sec"><div class="fa-sec-h">共识与分歧</div><div class="fa-cols">`;
          if (b.agreement.length) {
            html += `<div><div class="fa-sub-h">一致</div>${bulletsHtml(b.agreement)}</div>`;
          }
          if (b.disagreement.length) {
            html += `<div><div class="fa-sub-h">分歧</div>${bulletsHtml(b.disagreement, "fa-disagree")}</div>`;
          }
          html += `</div></section>`;
        } else if (b.kind === "risks") {
          html += `<section class="fa-sec fa-prose-sec"><div class="fa-sec-h">风险</div>${bulletsHtml(b.items, "fa-risks")}</section>`;
        } else if (b.kind === "narrative") {
          html += `<section class="fa-sec fa-prose-sec"><div class="fa-sec-h">叙事切换</div>${bulletsHtml(b.items)}</section>`;
        } else if (b.kind === "watch") {
          html += `<section class="fa-sec fa-prose-sec"><div class="fa-sec-h">时间窗</div>${bulletsHtml(b.items)}</section>`;
        } else if (b.kind === "highlights") {
          html += `<section class="fa-sec fa-prose-sec fa-sec-hl"><div class="fa-sec-h">要点</div><div class="fa-hl">${
            b.items.map((h) => {
              const title = (h && h.title) || "—";
              const note = h && h.note ? `<span class="note">${esc(h.note)}</span>` : "";
              if (h && h.url) {
                return `<a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(title)}${note}</a>`;
              }
              return `<span>${esc(title)}${note}</span>`;
            }).join("")
          }</div></section>`;
        } else if (b.kind === "disclaimer") {
          html += `<p class="fa-disclaimer">${esc(b.text)}</p>`;
        }
      }
      html += `</div>`;
      return html;
    }

    function renderAnalysis(d) {
      const root = document.getElementById("feed-analysis");
      if (!root) return;
      root.hidden = false;
      root.classList.remove("is-error");

      const heading = panelHeading(d);
      const series = resolveVizSeries(d);
      const proseBlocks = resolveProseBlocks(d);
      const hasAnyChart = !!(
        series.keywordBars.length ||
        series.confidenceDonut.length ||
        series.opportunityScores.length
      );

      let html = `
        <div class="fa-hd">
          <span class="fa-label">${esc(heading)}</span>
        </div>
        <div class="fa-body">`;

      html += renderProseHtml(proseBlocks);

      if (hasAnyChart) {
        html += `<div class="fa-viz">`;
        if (series.keywordBars.length) {
          html += `<div class="fa-chart-box" data-chart="kw"><div class="fa-sec-h">关键词强度</div><div class="fa-chart" id="fa-chart-kw"></div></div>`;
        }
        if (series.confidenceDonut.length) {
          html += `<div class="fa-chart-box" data-chart="conf"><div class="fa-sec-h">机会置信度</div><div class="fa-chart" id="fa-chart-conf"></div></div>`;
        }
        if (series.opportunityScores.length) {
          html += `<div class="fa-chart-box" data-chart="opp"><div class="fa-sec-h">机会评分</div><div class="fa-chart" id="fa-chart-opp"></div></div>`;
        }
        html += `</div>`;
      }

      html += `</div>`;
      root.innerHTML = html;
      renderFaCharts(series);
    }

    function showFaEmpty(msg) {
      const root = document.getElementById("feed-analysis");
      if (!root) return;
      root.hidden = false;
      root.classList.add("is-error");
      disposeFaCharts();
      root.innerHTML = `<div class="fa-hd"><span class="fa-label">实时分析</span></div><div class="fa-empty">${esc(msg)}</div>`;
    }

    let analysisUpdated = "";

    async function loadAnalysis() {
      try {
        const res = await fetch("../data/feed-analysis.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const d = await res.json();
        if (!d || typeof d !== "object") throw new Error("无效 JSON");
        analysisUpdated = d.generatedAtDisplay || d.updated || d.analyzedAt || "";
        renderAnalysis(d);
      } catch (e) {
        analysisUpdated = "";
        showFaEmpty(`暂无分析数据（${e.message || e}）`);
      }
    }

    function updateMeta(feedUpdated, n) {
      const parts = [`${feedUpdated || "—"} · ${n} 条`];
      if (analysisUpdated) parts.push(`分析 ${analysisUpdated}`);
      document.getElementById("meta").textContent = parts.join(" · ");
    }

    let _faResizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(_faResizeTimer);
      _faResizeTimer = setTimeout(() => faCharts.forEach((c) => { try { c.resize(); } catch (_) {} }), 120);
    });

    (async () => {
      const analysisP = loadAnalysis();
      try {
        const d = await (await fetch("../data/feed.json")).json();
        items = d.items || [];
        await analysisP;
        updateMeta(d.updated, items.length);
        const counts = items.reduce((m, x) => ((m[x.source] = (m[x.source] || 0) + 1), m), {});
        document.getElementById("kpis").innerHTML = `
          <div class="card"><div class="stat-label">全部</div><div class="stat-value blu">${items.length}</div></div>
          ${Object.entries(SRC).map(([k, name]) => `
            <div class="card"><div class="stat-label">${name}</div><div class="stat-value">${counts[k] || 0}</div></div>`).join("")}`;

        const sources = ["all", ...Object.keys(SRC).filter((k) => counts[k])];
        Object.keys(counts).forEach((k) => { if (!sources.includes(k)) sources.push(k); });
        document.getElementById("filters").innerHTML = sources.map((s) =>
          `<button type="button" data-s="${s}" class="${s === "all" ? "primary" : ""}">${s === "all" ? "全部" : (SRC[s] || s)}${s === "all" ? "" : ` ${counts[s] || 0}`}</button>`
        ).join("");
        document.getElementById("filters").addEventListener("click", (e) => {
          const b = e.target.closest("button[data-s]");
          if (!b) return;
          filter = b.getAttribute("data-s");
          document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("primary", x === b));
          render();
        });
        document.getElementById("q").addEventListener("input", (e) => { q = e.target.value; render(); });
        render();
      } catch (e) {
        document.getElementById("meta").textContent = "无法加载 feed.json";
        document.getElementById("list").innerHTML = `<div class="empty">${esc(String(e))}</div>`;
        await analysisP;
      }
    })();
  </script>
</body>
</html>
